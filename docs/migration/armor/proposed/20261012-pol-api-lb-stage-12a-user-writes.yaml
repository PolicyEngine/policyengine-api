name: pol-api-lb
rules:
- action: throttle
  description: ''
  kind: compute#securityPolicyRule
  match:
    expr:
      expression: request.path.matches('^/[a-z]{2}/metadata$')
  preview: false
  priority: 1000
  rateLimitOptions:
    conformAction: allow
    enforceOnKey: IP
    exceedAction: deny(429)
    rateLimitThreshold:
      count: 30
      intervalSec: 60
- action: throttle
  description: ''
  kind: compute#securityPolicyRule
  match:
    expr:
      expression: request.path.matches('^/[a-z]{2}/calculate(?:-full)?$')
  preview: true
  priority: 1100
  rateLimitOptions:
    conformAction: allow
    enforceOnKey: IP
    exceedAction: deny(429)
    rateLimitThreshold:
      count: 75
      intervalSec: 60
- action: throttle
  description: 'Stage 12A: per-IP limit on user-owned writes'
  kind: compute#securityPolicyRule
  match:
    expr:
      expression: request.method.matches('^(?:POST|PUT|PATCH|DELETE)$') && request.path.matches('^/v2/(?:me|user-)')
  preview: true
  priority: 1200
  rateLimitOptions:
    conformAction: allow
    enforceOnKey: IP
    exceedAction: deny(429)
    rateLimitThreshold:
      count: 120
      intervalSec: 60
- action: allow
  description: default rule
  kind: compute#securityPolicyRule
  match:
    config:
      srcIpRanges:
      - '*'
    versionedExpr: SRC_IPS_V1
  preview: false
  priority: 2147483647
