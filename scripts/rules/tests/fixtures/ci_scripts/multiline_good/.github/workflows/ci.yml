name: CI
on: pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: bash .github/scripts/build.sh
      - name: Test
        run: python -m pytest tests -q | tee pytest.log
      - name: Report
        run: echo "${{ github.event_name == 'push' && 'push' || 'pr' }}; done"
