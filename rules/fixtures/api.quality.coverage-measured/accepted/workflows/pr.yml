# Proof fixture for api.quality.coverage-measured (the accepted case).
on: pull_request
jobs:
  test:
    steps:
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage-shard-${{ matrix.shard_index }}
          path: coverage.xml
  upload-test-coverage:
    needs: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-coverage-shard-*
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
