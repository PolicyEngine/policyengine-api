# Proof fixture for api.quality.coverage-measured (the rejected case): the
# upload has no flag and no token, and the integration job uploads nothing.
on: pull_request
jobs:
  test:
    steps:
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: test-coverage-shard-${{ matrix.shard_index }}
          path: coverage.xml
  upload-test-coverage:
    needs: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-coverage-shard-*
      - uses: codecov/codecov-action@v5
        with:
          directory: coverage
  integration:
    steps:
      - run: uv run --frozen --extra dev coverage xml -i -o coverage-v2.xml
