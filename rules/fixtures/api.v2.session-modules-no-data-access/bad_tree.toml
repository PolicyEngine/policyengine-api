"policyengine_api/services/v2/policies/database_session.py" = """
from sqlalchemy import text


class PolicyDatabaseSession:
    def save(self, row, policy_id):
        with self._session_factory.begin() as session:
            session.add(row)
            session.execute(text("DELETE FROM policies"))
            return session.get(type(row), policy_id)
