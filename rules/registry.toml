# --- Weighted microdata ---------------------------------------------------

[[rule]]
id = "api.microdata.weights-not-values"
category = "microdata"
statement = "Microdata columns are weights, values, labels or counts: weights are only summed plainly to count entities or passed as weights=, values are aggregated with their own entity's weights, labels only group or filter, and counts derive from weights."
rationale = "docs/engineering/skills/microdata-weights.md#weights-arent-values"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.microdata.weights-not-aggregated-as-values"
category = "microdata"
statement = "A weight column is never aggregated as a value: never the value of a weighted MicroSeries, the variable of a weighted aggregator, or frame[<weight>] followed by a weighted reduction."
rationale = "docs/engineering/skills/microdata-weights.md#rules"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/services/test_microdata_weight_boundaries.py::test_weights_are_never_aggregated_as_values"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[rule.proof]
bad_fixture = "rules/fixtures/api.microdata.weights-not-aggregated-as-values/bad_budget.py"
good_fixture = "rules/fixtures/api.microdata.weights-not-aggregated-as-values/good_budget.py"
test = "tests/unit/services/test_microdata_weight_boundaries.py::test_rule_proof_weights_not_aggregated_as_values"

[[rule]]
id = "api.microdata.weight-stripping-confined"
category = "microdata"
statement = "Raw values are read from weighted microdata (np.array, np.asarray, .values, .to_numpy(), .tolist(), pd.DataFrame or pd.Series) only in a designated stripping module, and the Public API has none yet."
rationale = "docs/engineering/skills/microdata-weights.md#handling-a-finding"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/services/test_microdata_weight_boundaries.py::test_weight_stripping_stays_in_the_designated_module"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[rule.proof]
bad_fixture = "rules/fixtures/api.microdata.weight-stripping-confined/bad_net_income.py"
good_fixture = "rules/fixtures/api.microdata.weight-stripping-confined/good_net_income.py"
test = "tests/unit/services/test_microdata_weight_boundaries.py::test_rule_proof_weight_stripping_confined"

[[rule]]
id = "api.microdata.unweighted-series-are-labels"
category = "microdata"
statement = "A MicroSeries built without weights= is a label: it only groups or filters weighted series and is never reduced itself."
rationale = "docs/engineering/skills/microdata-weights.md#rules"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/services/test_microdata_weight_boundaries.py::test_unweighted_series_are_only_labels"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[rule.proof]
bad_fixture = "rules/fixtures/api.microdata.unweighted-series-are-labels/bad_decile.py"
good_fixture = "rules/fixtures/api.microdata.unweighted-series-are-labels/good_decile.py"
test = "tests/unit/services/test_microdata_weight_boundaries.py::test_rule_proof_unweighted_series_are_labels"

# --- Code quality and types ------------------------------------------------

[[rule]]
id = "api.quality.ruff-format"
category = "quality"
statement = "All Python files are formatted with ruff format."
rationale = "docs/engineering/skills/github-prs.md#commit-hygiene"
scope = ["**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "format"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff format --check"

[[rule]]
id = "api.quality.ruff-lint"
category = "quality"
statement = "All Python code passes ruff check with every ruff rule selected (ALL), with no ratchet, except the ignores in pyproject.toml: COM812 and ISC001, which conflict with ruff format, and D203 and D213, which conflict with the kept D211 and D212."
rationale = "docs/engineering/skills/rules-registry.md#baselines"
scope = ["**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "lint"
codes = ["ALL"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.runtime-evaluated-models-resolve"
category = "quality"
statement = "Every package model is one ruff treats as runtime-evaluated (a base resolves, through the import in its own module, to a name in runtime-evaluated-base-classes, or is a same-module class that does), and every Pydantic model and SQLAlchemy mapper resolves its annotations once the package is imported."
rationale = "docs/engineering/skills/typing-only-imports.md#models-that-read-annotations-at-runtime"
scope = ["policyengine_api/**/*.py", "pyproject.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/unit/test_runtime_evaluated_annotations.py::test_every_model_base_is_listed_for_ruff",
  "tests/unit/test_runtime_evaluated_annotations.py::test_base_resolution_matches_ruff",
  "tests/unit/test_runtime_evaluated_annotations.py::test_every_pydantic_model_resolves_its_annotations",
  "tests/unit/test_runtime_evaluated_annotations.py::test_every_sqlalchemy_mapper_configures",
  "tests/unit/test_runtime_evaluated_annotations.py::test_skipped_app_modules_define_no_classes",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.quality.alembic-revisions-unused-imports"
category = "quality"
statement = "Ruff neither lints nor formats Alembic revision files (extend-exclude in pyproject.toml), because they must stay exactly as Alembic generates them."
rationale = "docs/engineering/skills/alembic-migrations.md#mandatory-generation-rule"
scope = ["migrations/*/versions/*.py"]
tier = "mechanical"
status = "advisory"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.quality.tests-ruff-exemptions"
category = "quality"
statement = "Test files may use pytest's bare assert, need no docstrings, annotations or named constants for magic numbers, and may reach into private members, live outside packages and import inside a test (S101, D1, ANN, PLR2004, SLF001, INP001, PLC0415). Their fakes may name methods after the interface they replace, such as a gRPC stub's Export (N802). They may also use fake credentials, naive datetimes, subprocess calls to repository scripts, SQL built from strings and prints (S105, S106, DTZ001, DTZ011, S603, S607, S608, T201), may import the lazily loaded packages at module level (TID253), and may leave a stand-in's arguments unused (ARG001, ARG002, ARG005). Every other ruff rule applies to tests."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = ["tests/**/*.py", "scripts/rules/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "**/tests/**"
codes = ["ANN", "ARG001", "ARG002", "ARG005", "D1", "DTZ001", "DTZ011", "INP001", "N802", "PLC0415", "PLR2004", "S101", "S105", "S106", "S603", "S607", "S608", "SLF001", "T201", "TID253"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.ci-cd-scripts-ruff-exemptions"
category = "quality"
statement = "CI/CD scripts under .github may print their results, run other programs, fetch fixed URLs, have hyphenated file names and import the lazily loaded packages at module level (T201, S603, S607, S310, N999, TID253); every other ruff rule applies to them."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = [".github/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = ".github/**"
codes = ["N999", "S310", "S603", "S607", "T201", "TID253"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.command-line-scripts-ruff-exemptions"
category = "quality"
statement = "Command-line scripts under scripts/ may print their output, run other programs, fetch fixed URLs, stamp today's date and pick random samples (T201, S603, S607, S310, DTZ011, S311); every other ruff rule applies to them."
