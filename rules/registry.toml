tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "alembic-v2-check"
invocation = "alembic-v2-check.yml"

[[rule]]
id = "api.migration.cross-database-integration"
category = "migration"
statement = "Cross-database integration tests pass against real MySQL and Postgres."
rationale = "docs/engineering/skills/testing.md#focused-commands"
scope = ["tests/integration/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "v2-integration-check"
invocation = "v2-integration-check.yml"

[[rule]]
id = "api.migration.alembic-autogenerated-only"
category = "migration"
statement = "Alembic revisions are autogenerated against an explicitly selected v1 or v2 configuration; never hand-written DDL or data operations."
rationale = "docs/engineering/skills/alembic-migrations.md#mandatory-generation-rule"
scope = ["migrations/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
