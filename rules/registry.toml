# --- Dependencies and uv.lock ---------------------------------------------

[[rule]]
id = "api.dependencies.lock-committed"
category = "dependencies"
statement = "Every directory with a pyproject.toml has a committed uv.lock beside it, and a pull request CI job runs uv lock --check for it."
rationale = "docs/engineering/skills/dependencies.md#we-use-uvlock"
scope = ["pyproject.toml", "uv.lock"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "uv lock --check"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/lock_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/lock_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockCommittedProof::test_rule_proof_lock_committed"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.dependencies.install-from-lock"
category = "dependencies"
statement = "Every install of Python packages in a workflow, a shell script, a Makefile, a Dockerfile or a Modal image installs exactly what uv.lock pins (uv sync --frozen, uv run --frozen), unless it is a registered exception."
rationale = "docs/engineering/skills/dependencies.md#we-install-from-uvlock"
scope = [".github/workflows/*.yml", ".github/**/*.sh", "Makefile", "**/Dockerfile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/install_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/install_good"
test = "scripts/rules/tests/test_locked_installs.py::TestLockedInstallsProof::test_rule_proof_install_from_lock"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule.exception]]
path = ".github/workflows/pr.yml"
match = 'pip install "shellcheck-py=='
category = "pinned-tool"
reason = "shellcheck is a command-line tool the ci-scripts guard runs; it is not a dependency of the project."

[[rule.exception]]
path = ".github/workflows/push.yml"
match = 'pip install "shellcheck-py=='
category = "pinned-tool"
reason = "shellcheck is a command-line tool the ci-scripts guard runs; it is not a dependency of the project."

[[rule.exception]]
path = ".github/scripts/install_locked_ruff.sh"
match = 'pip install "ruff=='
category = "pinned-tool"
reason = "Installs the ruff version uv.lock pins, read from uv.lock, without installing the whole project for the lint job."

[[rule.exception]]
path = ".github/workflows/migrate-v1-cloud-sql.yml"
match = 'pip install -e ".[dev]"'
reason = "The migration scripts run with the bare python setup-python provides, against the production and staging Cloud SQL databases; moving them to uv run --frozen has not been tested against those databases."
removal = "the job installs with uv sync --frozen and runs its scripts through uv run --frozen, after a run against the staging database succeeds"

[[rule.exception]]
path = ".github/workflows/process-v1-household-mirror-event.yml"
match = 'pip install -e ".[dev]"'
reason = "The operator script runs with the bare python setup-python provides, against the production and staging databases; moving it to uv run --frozen has not been tested against those databases."
removal = "the job installs with uv sync --frozen and runs its script through uv run --frozen, after a run against the staging database succeeds"

[[rule.exception]]
path = ".github/workflows/update-policyengine-bundle.yaml"
match = "pip install requests uv"
reason = "The bundle updater changes uv.lock, so it runs before a matching lock exists; it installs uv itself and requests for its inline Python with setup-python's interpreter."
removal = "the workflow installs uv with astral-sh/setup-uv at a pinned version and runs its Python through uv run --frozen"

[[rule.exception]]
path = ".github/scripts/verify_observability_collector.sh"
match = "uv run --no-project --with grpcio --with opentelemetry-proto"
reason = "The collector check runs in the deploy job without installing the project; grpcio and opentelemetry-proto are locked only as transitive dependencies of the project."
removal = "the deploy job syncs the project with uv sync --frozen and the check runs through uv run --frozen"

[[rule.exception]]
path = "docker/Dockerfile"
match = 'pip install "policyengine[models]=='
reason = "The image packages the PolicyEngine .py bundle for interactive use, not this project; uv.lock locks this project. The bundle updater keeps the pin equal to pyproject.toml's, but ipython and the bundle's own dependencies are not pinned."
removal = "the image installs from uv.lock (uv sync --frozen, or uv export --frozen piped to pip install --no-deps), or is removed"

[[rule]]
id = "api.dependencies.test-from-lock"
category = "dependencies"
statement = "Every test command in a workflow, a shell script, a Makefile or a Dockerfile runs inside the uv.lock environment, through uv run --frozen."
rationale = "docs/engineering/skills/dependencies.md#we-test-from-uvlock"
scope = [".github/workflows/*.yml", ".github/**/*.sh", "Makefile", "**/Dockerfile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/test_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/test_good"
test = "scripts/rules/tests/test_locked_installs.py::TestTestFromLockProof::test_rule_proof_test_from_lock"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.dependencies.scheduled-relock"
category = "dependencies"
statement = "A workflow on a schedule relocks every uv.lock with upgrades and opens or updates a pull request with the result."
rationale = "docs/engineering/skills/dependencies.md#we-relock-on-a-schedule"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "locked-installs"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/locked_installs/relock_bad"
good_fixture = "scripts/rules/tests/fixtures/locked_installs/relock_good"
test = "scripts/rules/tests/test_locked_installs.py::TestScheduledRelockProof::test_rule_proof_scheduled_relock"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

# --- Process and repository hygiene ----------------------------------------

[[rule]]
id = "api.process.rules-registry"
category = "process"
statement = "Every rule is registered in rules/registry.toml, is enforced where it claims to be, and its rendered views are current."
rationale = "docs/engineering/skills/rules-registry.md"
scope = ["rules/registry.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"

[[rule]]
id = "api.agents.adapters-point-to-agents-md"
category = "process"
statement = "CLAUDE.md and .github/copilot-instructions.md only point to AGENTS.md; skills and rules are listed in AGENTS.md alone."
rationale = "AGENTS.md"
scope = ["CLAUDE.md", ".github/copilot-instructions.md"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/adapters/bad_CLAUDE.md"
good_fixture = "scripts/rules/tests/fixtures/adapters/good_CLAUDE.md"
test = "scripts/rules/tests/test_adapters.py::TestAdaptersProof::test_rule_proof_adapters"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.process.pr-tracking-issue"
category = "process"
statement = "Every PR has a tracking issue in this repository, and the first line of its description is Fixes #ISSUE_NUMBER."
rationale = "docs/engineering/skills/github-prs.md#tracking-issues"
scope = [".github/pull_request_template.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.changelog-fragment"
category = "process"
statement = "Every PR adds a changelog.d fragment."
rationale = "docs/engineering/skills/github-prs.md"
scope = ["changelog.d"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "check-changelog"
invocation = "check_changelog_fragment.sh"

[[rule]]
id = "api.process.docker-image-builds"
category = "process"
statement = "The API Docker image builds."
rationale = "docs/engineering/skills/testing.md"
scope = ["docker/*"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test_container_builds"
invocation = "docker build"

[[rule]]
id = "api.process.cloud-run-image-builds"
category = "process"
statement = "The Cloud Run container image builds."
rationale = "docs/engineering/skills/testing.md"
scope = ["gcp/cloud_run/Dockerfile"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test_cloud_run_container_builds"
invocation = "gcp/cloud_run/Dockerfile"

[[rule]]
id = "api.process.rule-machinery-code-owned"
category = "process"
statement = "Changes to the rule machinery (rules/, scripts/rules/, scripts/guards/, scripts/run_quality_guards.py and CODEOWNERS) need approval from a core developer other than the author."
rationale = ".github/CODEOWNERS"
scope = [".github/CODEOWNERS"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.agents-never-bypass"
category = "process"
statement = "Agents never bypass branch rules, even with admin credentials: no gh pr merge --admin and no bypass option; a blocked merge is reported to a human."
rationale = "docs/engineering/skills/github-prs.md#branch-rules"
scope = ["AGENTS.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.agents-suppress-as-last-resort"
category = "process"
statement = "Agents add an inline ruff suppression (noqa) only when neither a code change nor a ruff setting removes the finding, and a PR lists every inline suppression it adds, with the reason."
rationale = "docs/engineering/skills/rules-registry.md#inline-suppressions"
scope = ["**/*.py"]
tier = "judgment"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.stacked-prs-full-ci-at-bottom"
category = "process"
statement = "In a stack of pull requests, only the lowest unmerged one runs the full PR workflow. Every pr.yml job is needed by the CI complete gate, which fails on the pull requests above it and otherwise passes only when every job passed, so a stack merges bottom-up and nothing merges untested."
rationale = "docs/engineering/skills/github-prs.md#stacked-prs-and-ci"
scope = [".github/workflows/pr.yml", ".github/scripts/check_ci_complete.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/test_ci_complete_gate.py::test_pr_workflow_is_gated"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "ci-complete"
invocation = "check_ci_complete.sh"
[rule.proof]
bad_fixture = "rules/fixtures/api.process.stacked-prs-full-ci-at-bottom/bad_pr.yml"
good_fixture = "rules/fixtures/api.process.stacked-prs-full-ci-at-bottom/good_pr.yml"
test = "tests/unit/test_ci_complete_gate.py::test_rule_proof_gate_check"
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.process.makefile-phony"
category = "process"
statement = "Command-only Makefile targets are declared in .PHONY, and .PHONY stays in sync when targets are renamed or removed."
rationale = "docs/engineering/skills/repository-maintenance.md#command-only-make-targets"
scope = ["Makefile"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.observability.id-is-diagnostic-only"
category = "observability"
statement = "observability_id is used only to query diagnostic records, never for idempotency, cache ownership, authorization, database identity, routing or calculation behavior."
rationale = "docs/engineering/skills/observability.md#identifier-registry"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.observability.registered-stages-only"
category = "observability"
statement = "Span names come from the stage plans in policyengine_api.observability.stages; route and service code never adds span-name string literals."
rationale = "docs/engineering/skills/observability.md#runtime-stages"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"
