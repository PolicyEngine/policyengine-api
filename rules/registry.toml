[[rule]]
id = "api.quality.tests-ruff-exemptions"
category = "quality"
statement = "Test files may use pytest's bare assert, need no docstrings, annotations or named constants for magic numbers, and may reach into private members, live outside packages and import inside a test (S101, D1, ANN, PLR2004, SLF001, INP001, PLC0415). Their fakes may name methods after the interface they replace, such as a gRPC stub's Export (N802). They may also use fake credentials, naive datetimes, subprocess calls to repository scripts, SQL built from strings and prints (S105, S106, DTZ001, DTZ011, S603, S607, S608, T201), may import the lazily loaded packages at module level (TID253), and may leave a stand-in's arguments unused (ARG001, ARG002, ARG005). Every other ruff rule applies to tests."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = ["tests/**/*.py", "scripts/rules/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "**/tests/**"
codes = ["ANN", "ARG001", "ARG002", "ARG005", "D1", "DTZ001", "DTZ011", "INP001", "N802", "PLC0415", "PLR2004", "S101", "S105", "S106", "S603", "S607", "S608", "SLF001", "T201", "TID253"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.ci-cd-scripts-ruff-exemptions"
category = "quality"
statement = "CI/CD scripts under .github may print their results, fetch fixed URLs, have hyphenated file names and import the lazily loaded packages at module level (T201, S310, N999, TID253); every other ruff rule applies to them."
