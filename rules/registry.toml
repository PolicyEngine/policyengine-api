good_fixture = "rules/fixtures/api.microdata.weights-not-aggregated-as-values/good_budget.py"
test = "tests/unit/services/test_microdata_weight_boundaries.py::test_rule_proof_weights_not_aggregated_as_values"

[[rule]]
id = "api.microdata.weight-stripping-confined"
category = "microdata"
statement = "Raw values are read from weighted microdata (np.array, np.asarray, .values, .to_numpy(), .tolist(), pd.DataFrame or pd.Series) only in a designated stripping module, and the Public API has none yet."
