nodes = [
  "tests/unit/data/test_database_access_boundaries.py::test_non_test_code_reaches_database_drivers_only_where_declared",
  "tests/unit/data/test_database_access_boundaries.py::test_non_test_code_changes_schema_only_through_alembic",
  "tests/unit/data/test_database_access_boundaries.py::test_publication_staging_tables_are_temporary_and_dropped_at_commit",
  "tests/unit/data/test_database_access_boundaries.py::test_rule_exceptions_name_a_known_category_and_what_they_allow",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[rule.proof]
bad_fixture = "rules/fixtures/api.data.sqlalchemy-and-alembic-only/bad_database_access.py"
good_fixture = "rules/fixtures/api.data.sqlalchemy-and-alembic-only/good_database_access.py"
test = "tests/unit/data/test_database_access_boundaries.py::test_rule_proof_sqlalchemy_and_alembic_only"
# Each exception names a module and, in match, the one construct the check
# reports there (category driver-access or schema-change), or a path pattern
# the check doesn't scan (category migration-revision). The check fails on an
# exception that no longer matches anything.
[[rule.exception]]
path = "policyengine_api/data/v2/catalog/publication_staging.py"
match = "import psycopg.sql"
category = "driver-access"
reason = "Catalog publication streams rows with Postgres COPY ... FROM STDIN, which SQLAlchemy has no API for, and composes the COPY statement with psycopg's SQL composition."

[[rule.exception]]
path = "policyengine_api/data/v2/catalog/publication_staging.py"
match = "import psycopg.types.json.Jsonb"
category = "driver-access"
reason = "Catalog publication's COPY sends JSON values with psycopg's JSONB adapter."

[[rule.exception]]
path = "policyengine_api/data/v2/catalog/publication_staging.py"
match = "attribute .driver_connection"
category = "driver-access"
reason = "Catalog publication runs COPY through the psycopg connection beneath a SQLAlchemy Connection that SQLAlchemy opened and still manages, so the transaction stays SQLAlchemy's."

[[rule.exception]]
path = "policyengine_api/data/v2/catalog/publication_staging.py"
match = "call STAGING_METADATA.create_all()"
category = "schema-change"
reason = "The publication staging tables are TEMPORARY with ON COMMIT DROP, so Postgres drops them when the publishing transaction commits and they are not persistent schema; test_publication_staging_tables_are_temporary_and_dropped_at_commit checks every table."

[[rule.exception]]
path = "policyengine_api/data/orm_pool_events.py"
match = "attribute ._sock"
category = "driver-access"
reason = "The v1 pool's diagnostics read the file descriptor and local port of pymysql's socket from the driver connection a SQLAlchemy pool event passes them, because SQLAlchemy has no API for a connection's socket. They never read or write through the socket or the driver connection, and import no driver."

[[rule.exception]]
path = "migrations/*/versions/*.py"
category = "migration-revision"
reason = "Alembic generates the revisions, and they are where schema changes belong, so the check doesn't scan them. Ruff skips the same files (extend-exclude in pyproject.toml)."

