# --- Code quality and types ------------------------------------------------

[[rule]]
id = "api.quality.ruff-format"
category = "quality"
statement = "All Python files are formatted with ruff format."
rationale = "docs/engineering/skills/github-prs.md#commit-hygiene"
scope = ["**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "format"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff format --check"

[[rule]]
id = "api.quality.ruff-lint"
category = "quality"
statement = "All Python code passes ruff check with every rule family selected in pyproject.toml, with no ratchet; families are added one themed group at a time until the selection is ALL."
rationale = "docs/engineering/skills/rules-registry.md#baselines"
scope = ["**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = true
[rule.enforcer]
kind = "ruff"
mode = "lint"
codes = ["ANN", "BLE", "D", "DTZ", "E4", "E7", "E9", "EM", "ERA", "EXE", "F", "FIX", "FLY", "FURB", "G", "I", "LOG", "PIE", "PYI", "RET", "RSE", "S", "T20", "TC", "TD", "TRY", "UP", "W"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.runtime-evaluated-models-resolve"
category = "quality"
statement = "Every package model is one ruff treats as runtime-evaluated (a base resolves, through the import in its own module, to a name in runtime-evaluated-base-classes, or is a same-module class that does), and every Pydantic model and SQLAlchemy mapper resolves its annotations once the package is imported."
rationale = "docs/engineering/skills/typing-only-imports.md#models-that-read-annotations-at-runtime"
scope = ["policyengine_api/**/*.py", "pyproject.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = [
  "tests/unit/test_runtime_evaluated_annotations.py::test_every_model_base_is_listed_for_ruff",
  "tests/unit/test_runtime_evaluated_annotations.py::test_base_resolution_matches_ruff",
  "tests/unit/test_runtime_evaluated_annotations.py::test_every_pydantic_model_resolves_its_annotations",
  "tests/unit/test_runtime_evaluated_annotations.py::test_every_sqlalchemy_mapper_configures",
  "tests/unit/test_runtime_evaluated_annotations.py::test_skipped_app_modules_define_no_classes",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.quality.alembic-revisions-unused-imports"
category = "quality"
statement = "Ruff doesn't lint Alembic revision files (lint.exclude in pyproject.toml), because they must stay exactly as Alembic generates them."
rationale = "docs/engineering/skills/alembic-migrations.md#mandatory-generation-rule"
scope = ["migrations/*/versions/*.py"]
tier = "mechanical"
status = "advisory"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.quality.tests-ruff-exemptions"
category = "quality"
statement = "Test files may use pytest's bare assert and need no docstrings, annotations or named constants for magic numbers (S101, D1, ANN, PLR2004). They may also use fake credentials, naive datetimes, subprocess calls to repository scripts, SQL built from strings and prints (S105, S106, DTZ001, DTZ011, S603, S607, S608, T201). Every other ruff rule applies to tests."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = ["tests/**/*.py", "scripts/rules/tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "**/tests/**"
codes = ["ANN", "D1", "DTZ001", "DTZ011", "PLR2004", "S101", "S105", "S106", "S603", "S607", "S608", "T201"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.ci-cd-scripts-ruff-exemptions"
category = "quality"
statement = "CI/CD scripts under .github may print their results and fetch fixed URLs (T201, S310); every other ruff rule applies to them."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = [".github/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = ".github/**"
codes = ["S310", "T201"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.command-line-scripts-ruff-exemptions"
category = "quality"
statement = "Command-line scripts under scripts/ may print their output, run other programs, fetch fixed URLs, stamp today's date, pick random samples and ignore a failed best-effort step (T201, S603, S607, S310, DTZ011, S311, S110); every other ruff rule applies to them."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = ["scripts/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "scripts/**"
codes = ["DTZ011", "S110", "S310", "S311", "S603", "S607", "T201"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.command-line-modules-ruff-exemptions"
category = "quality"
statement = "Application modules that also run as command-line programs (if __name__ == \"__main__\") may print their output (T201); every other ruff rule applies to them."
rationale = "docs/engineering/skills/rules-registry.md#file-level-exceptions"
scope = [
    "policyengine_api/data/v2/catalog/initialization.py",
    "policyengine_api/data/v2/household_migration_qualification.py",
    "policyengine_api/data/v2/policy_migration_qualification.py",
    "policyengine_api/data/v2/user_association_migration_qualification.py",
    "policyengine_api/worker_spm_release.py",
]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "ruff"
mode = "per-file-ignore"
pattern = "policyengine_api/{data/v2/catalog/initialization,data/v2/household_migration_qualification,data/v2/policy_migration_qualification,data/v2/user_association_migration_qualification,worker_spm_release}.py"
codes = ["T201"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "lint"
invocation = "ruff check ."

[[rule]]
id = "api.quality.mypy-v2"
category = "quality"
statement = "Shared query models, FastAPI dependencies, v2 routes and services, and the user sign-in and account-deletion libraries pass mypy with untyped definitions disallowed."
rationale = "docs/engineering/skills/v2-code-organization.md"
scope = ["policyengine_api/fastapi_routes/v2/**/*.py", "policyengine_api/services/v2/**/*.py", "policyengine_api/libs/user_auth.py", "policyengine_api/libs/auth0_management.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "mypy"
paths = [
  "policyengine_api/query_parameters.py",
  "policyengine_api/fastapi_routes/query_parameters.py",
  "policyengine_api/fastapi_routes/dependencies.py",
  "policyengine_api/fastapi_routes/v2",
  "policyengine_api/services/v2",
  "policyengine_api/libs/user_auth.py",
  "policyengine_api/libs/auth0_management.py",
]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "typecheck-v2"
invocation = "mypy"

[[rule]]
id = "api.quality.tests-pass"
category = "quality"
statement = "The unit, contract and to-refactor test suites pass."
rationale = "docs/engineering/skills/testing.md"
scope = ["tests/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.quality.environment-variables-load"
category = "quality"
statement = "Required environment variables and credentials load in a deployed-like environment."
rationale = "docs/engineering/skills/testing.md"
scope = ["tests/env_variables/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test_env_vars"
invocation = "tests/env_variables"

# --- CI workflows and scripts ----------------------------------------------

[[rule]]
id = "api.ci.multiline-run-is-script"
category = "ci"
statement = "A GitHub Actions run: block holds one line of code and no chained commands (&&, ||, ;); anything more lives in a tested script under .github/scripts/, called from a single-line step."
rationale = "docs/engineering/skills/ci-workflows.md#one-line-of-code-per-run-block"
scope = [".github/workflows/*.yml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "ci-scripts"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/ci_scripts/multiline_bad"
good_fixture = "scripts/rules/tests/fixtures/ci_scripts/multiline_good"
test = "scripts/rules/tests/test_ci_scripts.py::TestCiScriptsProof::test_rule_proof_multiline_run"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.ci.workflow-scripts-tested"
category = "ci"
statement = "Every shell script a workflow calls is run by at least one test."
rationale = "docs/engineering/skills/ci-workflows.md#testing-a-workflow-script"
scope = [".github/scripts/*.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "ci-scripts"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/ci_scripts/untested_bad"
good_fixture = "scripts/rules/tests/fixtures/ci_scripts/untested_good"
test = "scripts/rules/tests/test_ci_scripts.py::TestCiScriptsProof::test_rule_proof_untested_script"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.ci.shell-scripts-pass-shellcheck"
category = "ci"
statement = "Every shell script under .github/scripts/ passes shellcheck."
rationale = "docs/engineering/skills/ci-workflows.md#writing-a-workflow-script"
scope = [".github/scripts/*.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "ci-scripts"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/ci_scripts/shellcheck/bad_script.sh"
good_fixture = "scripts/rules/tests/fixtures/ci_scripts/shellcheck/good_script.sh"
test = "scripts/rules/tests/test_ci_scripts.py::TestCiScriptsProof::test_rule_proof_shellcheck"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

# --- Process and repository hygiene ----------------------------------------

[[rule]]
