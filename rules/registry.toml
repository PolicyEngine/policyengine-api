# Rules registry for policyengine-api.
#
# Every rule that governs this repository is declared here: what it says, how
# mechanically it is enforced, where it runs in CI, and whether a checker has
# been proven to reject a bad example. `python -m scripts.rules guard` keeps this
# file honest; `python -m scripts.rules render` regenerates
# docs/generated/rules.md and the Rules block in AGENTS.md.
#
# How to add or change a rule: docs/engineering/skills/rules-registry.md

schema_version = 1
repo = "policyengine-api"

[[category]]
id = "v2-layers"
title = "API v2 layer boundaries"

[[category]]
id = "runtime-layers"
title = "Runtime persistence and route boundaries"

[[category]]
id = "startup"
title = "Import and startup side effects"

[[category]]
id = "isolation"
title = "Data source isolation"

[[category]]
id = "migration"
title = "Migration and schema"

[[category]]
id = "microdata"
title = "Weighted microdata"

[[category]]
id = "quality"
title = "Code quality and types"

[[category]]
id = "observability"
title = "Observability"

[[category]]
id = "ci"
title = "CI workflows and scripts"

[[category]]
id = "dependencies"
title = "Dependencies and uv.lock"

[[category]]
id = "process"
title = "Process and repository hygiene"

[discovery]
workflows = [".github/workflows/pr.yml", ".github/workflows/pr-description.yml"]
ignore_jobs = [
  { job = "upload-test-coverage", reason = "sends the test shards' coverage reports to Codecov in one upload; it checks nothing" },
]
guard_test_globs = [
  "tests/**/test_*boundar*.py",
  "tests/**/test_import_side_effects.py",
  "tests/unit/v2/test_stage12_comparison_isolation.py",
]
extra_guard_tests = [
  "tests/unit/v2/test_catalog_selection_modules.py::test_importing_the_validation_module_loads_no_database_code",
  "tests/unit/v2/test_catalog_selection_modules.py::test_the_reads_module_holds_the_catalog_query",
  "tests/unit/v2/test_catalog_selection_modules.py::test_the_validation_module_imports_no_database_code",
  "tests/unit/v2/test_catalog_extraction.py::test_extractor_has_no_direct_core_country_or_v1_metadata_imports",
  "tests/unit/v2/test_catalog_extraction.py::test_extractor_modules_have_no_direct_core_country_or_v1_metadata_imports",
  "tests/unit/v2/test_catalog_initialization.py::test_initializer_is_not_imported_by_application_startup_modules",
  "tests/unit/v2/test_metadata_service.py::test_read_modules_import_no_policyengine_or_v1_metadata_source",
  "tests/unit/v2/test_model_persistence.py::test_v2_models_do_not_create_a_parallel_sqlalchemy_orm_layer",
  "tests/unit/v2/test_report_v1_runtime_selection.py::test_existing_report_route_and_service_import_only_v1_persistence",
]

[agents]
instructions = "AGENTS.md"
adapters = ["CLAUDE.md", ".github/copilot-instructions.md"]

[ci_scripts]
workflows = ".github/workflows/*.yml"
scripts_dir = ".github/scripts"
test_globs = ["tests/**/test_*.py"]
multiline_baseline = "rules/baselines/ci-multiline-run.txt"
untested_baseline = "rules/baselines/ci-untested-scripts.txt"
shellcheck_baseline = "rules/baselines/ci-shellcheck.txt"

# --- API v2 layer boundaries ----------------------------------------------

[[rule]]
id = "api.v2.connectors-mutations-no-reads"
category = "v2-layers"
statement = "v2 mutation connectors (creates, updates, deletes) never issue select or get reads."
rationale = "docs/engineering/skills/v2-code-organization.md#database_connectors"
scope = ["policyengine_api/services/v2/*/database_connectors/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/v2/test_data_crud_boundaries.py::test_mutation_connectors_contain_no_database_reads"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.v2.connectors-reads-no-mutations"
category = "v2-layers"
statement = "v2 read connectors never insert, add or delete rows."
rationale = "docs/engineering/skills/v2-code-organization.md#database_connectors"
scope = ["policyengine_api/services/v2/*/database_connectors/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/v2/test_data_crud_boundaries.py::test_read_connectors_contain_no_database_mutations"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.v2.validators-transformations-no-db"
category = "v2-layers"
statement = "v2 validators and transformations never import SQLAlchemy or SQLModel query or session APIs."
rationale = "docs/engineering/skills/v2-code-organization.md#validatorspy"
scope = ["policyengine_api/services/v2/*/validators.py", "policyengine_api/services/v2/*/transformations.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/v2/test_data_crud_boundaries.py::test_validation_and_transformation_modules_have_no_database_query_dependency"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[rule.proof]
bad_fixture = "rules/fixtures/api.v2.validators-transformations-no-db/bad_validators.py"
good_fixture = "rules/fixtures/api.v2.validators-transformations-no-db/good_validators.py"
test = "tests/unit/v2/test_data_crud_boundaries.py::test_rule_proof_validators_transformations_no_db"

[[rule]]
id = "api.v2.session-modules-no-queries"
category = "v2-layers"
statement = "v2 database_session modules own session lifetime only and never build select, insert, update, delete or exec calls."
rationale = "docs/engineering/skills/v2-code-organization.md#database_sessionpy"
scope = ["policyengine_api/services/v2/*/database_session.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/v2/test_data_crud_boundaries.py::test_database_session_modules_do_not_construct_queries"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.v2.crud-checks-cover-every-resource"
category = "v2-layers"
statement = "The v2 CRUD boundary checks find modules by filename, so every resource package is covered, and every connector module is named as a create, read, update or delete module."
rationale = "docs/engineering/skills/v2-code-organization.md#resource-service-packages"
scope = ["policyengine_api/services/v2/*/database_connectors/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/v2/test_data_crud_boundaries.py::test_every_connector_module_is_classified"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.v2.files-assigned-to-layers"
category = "v2-layers"
statement = "Every .py file under services/v2 and fastapi_routes/v2 gets a layer from its file name alone, so the layer rules check it. A file that can't be renamed, outside a database_connectors package, needs a [[rule.exception]] for this rule in rules/registry.toml; it then gets the route checks under fastapi_routes/v2, or the validator, transformation and types checks under services/v2."
rationale = "docs/engineering/skills/v2-code-organization.md#file-layers"
scope = ["policyengine_api/services/v2/**/*.py", "policyengine_api/fastapi_routes/v2/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "v2-layers"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "rules/fixtures/api.v2.files-assigned-to-layers/bad_tree.toml"
good_fixture = "rules/fixtures/api.v2.files-assigned-to-layers/good_tree.toml"
test = "scripts/rules/tests/test_v2_layers.py::TestV2LayersProof::test_rule_proof_files_assigned_to_layers"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.v2.routes-no-sessions-or-sql"
category = "v2-layers"
statement = "v2 route modules never open database sessions or construct SQL: they import no SQLAlchemy, SQLModel, connector, database_session, v1 ORM or v2 database module, and call no SQL builder, session method or session factory; they call one service method and map typed failures to HTTP."
rationale = "docs/engineering/skills/v2-code-organization.md#http-adapters"
scope = ["policyengine_api/fastapi_routes/v2/**/*.py"]
tier = "mechanical"
status = "ratcheted"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "v2-layers"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "rules/fixtures/api.v2.routes-no-sessions-or-sql/bad_tree.toml"
