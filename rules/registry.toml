[[rule]]
id = "api.process.rule-machinery-code-owned"
category = "process"
statement = "Changes to the rule machinery (rules/, scripts/rules/, scripts/guards/, scripts/run_quality_guards.py and CODEOWNERS) need approval from a core developer other than the author."
rationale = ".github/CODEOWNERS"
scope = [".github/CODEOWNERS"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.agents-never-bypass"
category = "process"
statement = "Agents never bypass branch rules, even with admin credentials: no gh pr merge --admin and no bypass option; a blocked merge is reported to a human."
rationale = "docs/engineering/skills/github-prs.md#branch-rules"
scope = ["AGENTS.md"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.agents-suppress-as-last-resort"
category = "process"
statement = "Agents add an inline suppression (noqa or type: ignore) only when neither a code change nor a checker setting removes the finding, and a PR lists every inline suppression it adds, with the reason. That each suppression names its code and gives its reason is the mechanical rule api.quality.suppressions-explained."
rationale = "docs/engineering/skills/rules-registry.md#inline-suppressions"
scope = ["**/*.py"]
tier = "judgment"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.process.stacked-prs-full-ci-at-bottom"
category = "process"
statement = "In a stack of pull requests, only the lowest unmerged one runs the full PR workflow. Every pr.yml job is needed by the CI complete gate, which fails on the pull requests above it and otherwise passes only when every job passed, so a stack merges bottom-up and nothing merges untested."
rationale = "docs/engineering/skills/github-prs.md#stacked-prs-and-ci"
scope = [".github/workflows/pr.yml", ".github/scripts/check_ci_complete.sh"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "pytest"
nodes = ["tests/unit/test_ci_complete_gate.py::test_pr_workflow_is_gated"]
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "ci-complete"
invocation = "check_ci_complete.sh"
[rule.proof]
bad_fixture = "rules/fixtures/api.process.stacked-prs-full-ci-at-bottom/bad_pr.yml"
good_fixture = "rules/fixtures/api.process.stacked-prs-full-ci-at-bottom/good_pr.yml"
test = "tests/unit/test_ci_complete_gate.py::test_rule_proof_gate_check"
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.process.makefile-phony"
category = "process"
statement = "Command-only Makefile targets are declared in .PHONY, and .PHONY stays in sync when targets are renamed or removed."
rationale = "docs/engineering/skills/repository-maintenance.md#command-only-make-targets"
scope = ["Makefile"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.observability.id-is-diagnostic-only"
category = "observability"
statement = "observability_id is used only to query diagnostic records, never for idempotency, cache ownership, authorization, database identity, routing or calculation behavior."
rationale = "docs/engineering/skills/observability.md#identifier-registry"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.observability.registered-stages-only"
category = "observability"
statement = "Span names come from the stage plans in policyengine_api.observability.stages; route and service code never adds span-name string literals."
rationale = "docs/engineering/skills/observability.md#runtime-stages"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"
