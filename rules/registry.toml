[[rule]]
id = "api.dependencies.declared-and-used"
category = "dependencies"
statement = "pyproject.toml declares what policyengine_api imports and nothing else: deptry finds no import that no declared distribution provides (DEP001), no declared runtime dependency the package never imports (DEP002), no import of a module installed only as another package's dependency (DEP003), no import of a package declared only as a development dependency (DEP004) and no declared standard-library module (DEP005), apart from the findings rules/baselines/deptry.txt lists and the rule's not-imported-package exceptions."
rationale = "docs/engineering/skills/dependencies.md#we-declare-what-we-import"
scope = ["pyproject.toml", "policyengine_api/**/*.py"]
tier = "mechanical"
status = "ratcheted"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "declared-dependencies"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[[rule.ci]]
workflow = ".github/workflows/push.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.baseline]
file = "rules/baselines/deptry.txt"
count = 16
[rule.proof]
bad_fixture = "rules/fixtures/api.dependencies.declared-and-used/rejected"
good_fixture = "rules/fixtures/api.dependencies.declared-and-used/accepted"
test = "scripts/rules/tests/test_declared_dependencies.py::TestDeclaredDependenciesProof::test_rule_proof_declared_and_used"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule.exception]]
path = "gcp/cloud_run/start.sh"
match = "gunicorn"
category = "not-imported-package"
reason = "The Cloud Run start command runs gunicorn as the server process; no module imports it."

[[rule.exception]]
path = "gcp/cloud_run/start.sh"
match = "uvicorn"
category = "not-imported-package"
reason = "gunicorn loads uvicorn's worker class by name (--worker-class uvicorn.workers.UvicornWorker); no module imports it."

[[rule.exception]]
path = "policyengine_api/data/orm.py"
match = "pymysql"
category = "not-imported-package"
reason = "The Cloud SQL connector loads the MySQL driver by name (driver=\"pymysql\"), as SQLAlchemy's mysql+pymysql dialect does; no module imports it."

# --- Process and repository hygiene ----------------------------------------

[[rule]]
id = "api.process.rules-registry"
category = "process"
statement = "Every rule is registered in rules/registry.toml, is enforced where it claims to be, and its rendered views are current."
rationale = "docs/engineering/skills/rules-registry.md"
scope = ["rules/registry.toml"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"

[[rule]]
id = "api.agents.adapters-point-to-agents-md"
category = "process"
statement = "CLAUDE.md and .github/copilot-instructions.md only point to AGENTS.md; skills and rules are listed in AGENTS.md alone."
rationale = "AGENTS.md"
scope = ["CLAUDE.md", ".github/copilot-instructions.md"]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
name = "rules-registry"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "run_quality_guards.py"
[rule.proof]
bad_fixture = "scripts/rules/tests/fixtures/adapters/bad_CLAUDE.md"
good_fixture = "scripts/rules/tests/fixtures/adapters/good_CLAUDE.md"
test = "scripts/rules/tests/test_adapters.py::TestAdaptersProof::test_rule_proof_adapters"
workflow = ".github/workflows/pr.yml"
job = "quality-guards"
invocation = "unittest discover -s scripts/rules/tests"

[[rule]]
id = "api.process.pr-tracking-issue"
category = "process"
statement = "The first line of every PR's description is Fixes #ISSUE_NUMBER, naming an open issue, not a pull request, in this repository; automated PRs open or reuse such an issue."
rationale = "docs/engineering/skills/github-prs.md#tracking-issues"
scope = [
  ".github/pull_request_template.md",
  ".github/workflows/pr-description.yml",
  ".github/scripts/check_pr_description.py",
  ".github/scripts/open_relock_pull_request.sh",
  ".github/scripts/update-policyengine-package.sh",
  ".github/scripts/close_bundle_update_issue.sh",
  ".github/workflows/close-bundle-update-issue.yml",
]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
step = "Check the first line and the tracking issue"
[[rule.ci]]
workflow = ".github/workflows/pr-description.yml"
job = "pr-description"
invocation = "check_pr_description.py"
[rule.proof]
bad_fixture = "rules/fixtures/api.process.pr-tracking-issue/bad_event.json"
good_fixture = "rules/fixtures/api.process.pr-tracking-issue/good_event.json"
test = "tests/unit/test_pr_description_check.py::test_rule_proof_pr_tracking_issue"
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

[[rule]]
id = "api.process.changelog-fragment"
category = "process"
statement = "Every PR adds, relative to its base commit, at least one changelog fragment of its own, a non-empty file directly in changelog.d/ named `<name>.<type>.md` with a type from [tool.towncrier] in pyproject.toml, and leaves nothing else there but .gitkeep; the PR check and the release's version bump read fragments through one definition, .github/changelog_fragments.py."
rationale = "docs/engineering/skills/github-prs.md#changelog-fragments"
scope = [
  "changelog.d",
  ".github/changelog_fragments.py",
  ".github/bump_version.py",
  ".github/scripts/check_changelog_fragment.sh",
]
tier = "mechanical"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "workflow-job"
[[rule.ci]]
workflow = ".github/workflows/pr.yml"
job = "check-changelog"
invocation = "check_changelog_fragment.sh"
[[rule.ci]]
workflow = ".github/workflows/push.yml"
job = "versioning"
invocation = "bump_version.py"
[rule.proof]
bad_fixture = "rules/fixtures/api.process.changelog-fragment/bad"
good_fixture = "rules/fixtures/api.process.changelog-fragment/good"
test = "tests/unit/test_changelog_fragments.py::test_rule_proof_changelog_fragment"
workflow = ".github/workflows/pr.yml"
job = "test"
invocation = "make test"

