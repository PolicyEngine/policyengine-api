job = "test_env_vars"
invocation = "tests/env_variables"

[[rule]]
id = "api.quality.file-length"
category = "quality"
statement = "A tracked Python file has at most 800 physical lines, or at most 1,500 if it is test code (a file under a tests or fixtures directory, or a conftest.py); a longer file is split by responsibility into modules, and keeps its public import path."
rationale = "docs/engineering/skills/file-length.md"
scope = ["**/*.py"]
tier = "metric"
status = "enforced"
autofix = false
[rule.enforcer]
kind = "quality-guard"
