# --- Weighted microdata ---------------------------------------------------

[[rule]]
id = "api.microdata.weights-not-values"
category = "microdata"
statement = "Microdata columns are weights, values, labels or counts: weights are only summed plainly to count entities or passed as weights=, values are aggregated with their own entity's weights, labels only group or filter, and counts derive from weights."
rationale = "docs/engineering/skills/microdata-weights.md#weights-arent-values"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "doc-only"
autofix = false
[rule.enforcer]
kind = "none"

[[rule]]
id = "api.microdata.weights-not-aggregated-as-values"
category = "microdata"
statement = "A weight column is never aggregated as a value: never the value of a weighted MicroSeries, the variable of a weighted aggregator, or frame[<weight>] followed by a weighted reduction."
rationale = "docs/engineering/skills/microdata-weights.md#rules"
scope = ["policyengine_api/**/*.py"]
tier = "mechanical"
status = "enforced"
autofix = false
