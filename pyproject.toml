[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policyengine-api"
version = "5.5.5"
description = "PolicyEngine API"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "a2wsgi>=1.10,<2",
    "alembic>=1.14,<2",
    "assertpy",
    "click>=8,<9",
    "cloud-sql-python-connector",
    "faiss-cpu",
    "fastapi>=0.115,<1",
    "flask>=3,<4",
    "flask-cors>=5,<6",
    "Flask-Caching>=2,<3",
    "google-cloud-logging>=3,<4",
    "google-cloud-secret-manager>=2,<3",
    "gunicorn",
    "httpx>=0.27.0",
    "markupsafe>=3,<4",
    "microdf_python>=1.0.0",
    "openai",
    "packaging>=24,<27",
    "policyengine-observability[flask,google,httpx,otlp-grpc]>=3.0.2,<4",
    "policyengine_canada==0.96.3",
    "policyengine-ng==0.5.1",
    "policyengine-il==0.1.0",
    # The models extra pins Core, US, UK, and the SPM calculator to the exact
    # versions certified by this PolicyEngine bundle. Cloud Run installs the
    # complete frozen environment from uv.lock; the generic image installs
    # this requirement directly.
    "policyengine[models]==6.7.5",
    "pydantic",
    "pymysql",
    "python-dotenv",
    "redis",
    "rq",
    "sqlalchemy>=2,<3",
    "streamlit",
    "uvicorn[standard]>=0.32,<1",
    "werkzeug",
    "sqlmodel>=0.0.39,<0.1",
    "psycopg[binary]>=3.3,<4",
    "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "mypy>=1.15,<2",
    "pytest",
    "pytest-snapshot",
    "pytest-timeout",
    "ruff>=0.9.0",
    "towncrier>=24.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["policyengine_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
# Rule families are enabled one themed group per PR, each fixing everything it
# finds (no ratchet), until the select list is "ALL". See
# docs/engineering/skills/rules-registry.md and rules/registry.toml.
select = [
    "E4", "E7", "E9", "F",
    # Group 1: safe auto-fixes.
    "FLY", "FURB", "I", "PIE", "PYI", "RET", "RSE", "UP", "W",
    # Group 2: typing-only imports.
    "TC",
    # Group 3: annotations.
    "ANN",
    # Group 4: docstrings.
    "D",
    # Group 5: exceptions and messages.
    "BLE", "EM", "TRY",
]
# Mutually exclusive pydocstyle pairs: keep D211 (no blank line before a class
# docstring) and D212 (summary on the first line).
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions must stay exactly as Alembic generates them
# (api.migration.alembic-autogenerated-only), so ruff does not lint them.
"migrations/*/versions/*.py" = ["ALL"]
# Tests may use pytest's bare assert, and need no docstrings, annotations or
# named constants for magic numbers. Every other rule applies to tests.
"**/tests/**" = ["ANN", "D1", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.11"
files = [
    "policyengine_api/query_parameters.py",
    "policyengine_api/fastapi_routes/query_parameters.py",
    "policyengine_api/fastapi_routes/dependencies.py",
    "policyengine_api/fastapi_routes/v2",
    "policyengine_api/services/v2",
    "policyengine_api/libs/user_auth.py",
    "policyengine_api/libs/auth0_management.py",
]
explicit_package_bases = true
follow_imports = "silent"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.towncrier]
package = "policyengine_api"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
[tool.ruff.lint.flake8-type-checking]
# Classes whose annotations Pydantic, SQLModel or SQLAlchemy evaluate at runtime, so their
# imports must stay at runtime. Ruff checks direct bases only, so every
# project class that other models inherit from is listed.
runtime-evaluated-base-classes = [
    "policyengine_api.data.v2.models.base.IdentifiedModel",
    "policyengine_api.data.v2.models.base.TimestampedModel",
    "policyengine_api.data.v2.models.comparison_runs.Stage12RunTimestamps",
    "policyengine_api.data.v2.models.reports.GeographicImpactBase",
    "policyengine_api.fastapi_routes.v2.households.document_models.HouseholdEntityRecord",
    "policyengine_api.fastapi_routes.v2.households.document_models.StrictHouseholdDocumentModel",
    "policyengine_api.fastapi_routes.v2.households.response_models.HouseholdSuccessResponse",
    "policyengine_api.fastapi_routes.v2.households.response_models.StrictHouseholdAPIModel",
    "policyengine_api.fastapi_routes.v2.me.response_models.AccountSuccessResponse",
    "policyengine_api.fastapi_routes.v2.me.response_models.StrictAccountAPIModel",
    "policyengine_api.fastapi_routes.v2.metadata.response_models.MetadataResourceSuccessResponse",
    "policyengine_api.fastapi_routes.v2.policies.response_models.PolicySuccessResponse",
    "policyengine_api.fastapi_routes.v2.policies.response_models.StrictPolicyAPIModel",
    "policyengine_api.fastapi_routes.v2.user_households.response_models.StrictUserHouseholdAPIModel",
    "policyengine_api.fastapi_routes.v2.user_households.response_models.UserHouseholdSuccessResponse",
    "policyengine_api.fastapi_routes.v2.user_policies.response_models.StrictUserPolicyAPIModel",
    "policyengine_api.fastapi_routes.v2.user_policies.response_models.UserPolicySuccessResponse",
    "policyengine_api.fastapi_routes.v2.user_reports.response_models.StoredSnapshotItem",
    "policyengine_api.fastapi_routes.v2.user_reports.response_models.StrictUserReportAPIModel",
    "policyengine_api.fastapi_routes.v2.user_reports.response_models.UserReportSuccessResponse",
    "policyengine_api.fastapi_routes.v2.user_simulations.response_models.StrictUserSimulationAPIModel",
    "policyengine_api.fastapi_routes.v2.user_simulations.response_models.UserSimulationSuccessResponse",
    "policyengine_api.query_parameters.CatalogQuery",
    "policyengine_api.query_parameters.CountryQuery",
    "policyengine_api.query_parameters.EconomyQuery",
    "policyengine_api.query_parameters.PaginationQuery",
    "policyengine_api.query_parameters.StrictQueryParameters",
    "policyengine_api.services.v2.associations.types.StrictAssociationModel",
    "policyengine_api.services.v2.households.types.HouseholdCreationInput",
    "policyengine_api.services.v2.households.types.StrictHouseholdInput",
    "policyengine_api.services.v2.metadata.types.MetadataModelVersion",
    "policyengine_api.services.v2.metadata.types.StrictResponseModel",
    "policyengine_api.services.v2.policies.types.PolicyCreationInput",
    "policyengine_api.services.v2.policies.types.StrictPolicyInput",
    "policyengine_api.services.v2.simulations.types.StrictContractModel",
    "policyengine_api.services.v2.user_accounts.types.AccountUpdateInput",
    "policyengine_api.services.v2.user_accounts.types.StrictAccountInput",
    "policyengine_api.services.v2.user_households.types.StrictUserHouseholdInput",
    "policyengine_api.services.v2.user_households.types.UserHouseholdCreateFields",
    "policyengine_api.services.v2.user_households.types.UserHouseholdCreationInput",
    "policyengine_api.services.v2.user_households.types.UserHouseholdUpdateInput",
    "policyengine_api.services.v2.user_policies.types.StrictAssociationInput",
    "policyengine_api.services.v2.user_policies.types.UserPolicyCreateFields",
    "policyengine_api.services.v2.user_policies.types.UserPolicyCreationInput",
    "policyengine_api.services.v2.user_policies.types.UserPolicyUpdateInput",
    "policyengine_api.services.v2.user_reports.types.StrictUserReportModel",
    "policyengine_api.services.v2.user_reports.types.UserReportCreateFields",
    "policyengine_api.services.v2.user_reports.types.UserReportUpdateInput",
    "policyengine_api.services.v2.user_reports.types._ReportPresentationFields",
    "policyengine_api.services.v2.user_simulations.types.StrictUserSimulationInput",
    "policyengine_api.services.v2.user_simulations.types.UserSimulationCreateFields",
    "policyengine_api.services.v2.user_simulations.types.UserSimulationUpdateInput",
    "policyengine_api.data.v1_models.V1Base",
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "sqlmodel.SQLModel",
]
# FastAPI evaluates endpoint annotations when routes are registered.
runtime-evaluated-decorators = [
    "fastapi.APIRouter.api_route",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
]
