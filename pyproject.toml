[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policyengine-api"
version = "5.40.0"
description = "PolicyEngine API"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    { name = "PolicyEngine", email = "hello@policyengine.org" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    "a2wsgi>=1.10,<2",
    "alembic>=1.14,<2",
    "assertpy",
    "click>=8,<9",
    "cloud-sql-python-connector",
    "faiss-cpu",
    "fastapi>=0.115,<1",
    "flask>=3,<4",
    "flask-cors>=5,<6",
    "Flask-Caching>=2,<3",
    "google-cloud-logging>=3,<4",
    "google-cloud-secret-manager>=2,<3",
    "gunicorn",
    # Catalog publication reads certified HDF5 artifacts from Hugging Face.
    "h5py>=3.16,<4",
    # The Simulation Entrypoint transport subclasses httpcore's network
    # backend and stream and builds its connection pool.
    "httpcore>=1.0.9,<2",
    "httpx>=0.27.0",
    "huggingface-hub>=1.12,<2",
    "markupsafe>=3,<4",
    "microdf_python>=1.0.0",
    "openai",
    "packaging>=24,<27",
    "policyengine-observability[flask,google,httpx,otlp-grpc]>=3.0.3,<4",
    # The models extra pins Core, US, UK, and the SPM calculator to the exact
    # versions certified by this PolicyEngine bundle. Cloud Run installs the
    # complete frozen environment from uv.lock; the generic image installs
    # this requirement directly.
    "policyengine[models]==6.17.1",
    "pydantic",
    "pymysql",
    "python-dotenv",
    "redis",
    "rq",
    "sqlalchemy>=2,<3",
    "streamlit",
    "uvicorn[standard]>=0.32,<1",
    "werkzeug",
    "sqlmodel>=0.0.39,<0.1",
    "psycopg[binary]>=3.3,<4",
    "pyjwt[crypto]>=2.10,<3",
    "typing-extensions>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    # The declared-dependencies quality guard runs it
    # (api.dependencies.declared-and-used); its findings and report format can
    # change between minor versions, so an upgrade is its own change.
    "deptry>=0.25.1,<0.26",
    # pr.yml's diff-coverage job runs it (api.quality.diff-coverage). 11.0 is
    # newer than two weeks; moving to it is its own change.
    "diff-cover>=10.6,<11",
    "mypy>=1.15,<2",
    "pytest",
    "pytest-snapshot",
    "pytest-timeout",
    "pytest-xdist",
    "import-linter>=2.15,<3",
    "ruff>=0.9.0",
    "towncrier>=24.8.0",
]

[dependency-groups]
# Only the daily telemetry error issues workflow needs these. It installs this
# group alone (uv run --frozen --only-group), not the API's dependencies.
telemetry-error-issues = [
    "google-cloud-bigquery>=3.30,<4",
]

# The declared-dependencies quality guard (scripts/rules/declared_dependencies.py)
# runs deptry on policyengine_api and requires exactly these settings
# (api.dependencies.declared-and-used). Tolerated findings live in
# rules/baselines/deptry.txt and the rule's exceptions in rules/registry.toml,
# never in a deptry ignore setting here.
[tool.deptry]
# The guard scans policyengine_api/ itself, and deptry treats only what is in
# the scanned directory (api, utils, data, ...) as the project's own modules,
# so without this it reports every import of policyengine_api.* as an
# undeclared dependency.
known_first_party = ["policyengine_api"]
# The dev extra holds development tools, not runtime dependencies.
optional_dependencies_dev_groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["policyengine_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
# Directories with no __init__.py on purpose (INP001). Ruff treats each one, and
# every directory below it, as a package when it resolves modules.
# - policyengine_api is a namespace package, which mypy reads with
#   explicit_package_bases. Its subdirectories still need an __init__.py:
#   coverage.py leaves out the modules no test imports in one that lacks
#   it (tests/unit/test_diff_coverage.py checks this).
# - .github (with .github/scripts) and migrations/v1 and v2 hold standalone
#   scripts and Alembic environments, run but never imported.
# - rules/fixtures holds rule proof fixtures, which tests read as source.
namespace-packages = [
    ".github",
    "migrations/v1",
    "migrations/v2",
    "policyengine_api",
    "rules/fixtures",
]
# Alembic revisions must stay exactly as Alembic generates them
# (api.migration.alembic-autogenerated-only), so neither ruff check nor ruff
# format touches them (api.quality.alembic-revisions-unused-imports). This is
# an exclusion, not a file-level exception: per-file-ignores are only for
# tests, CI/CD scripts and command-line scripts.
extend-exclude = ["migrations/*/versions/*.py"]

[tool.ruff.lint]
# Every ruff rule applies, with no ratchet, apart from the ignores below
# (api.quality.ruff-lint). See docs/engineering/skills/rules-registry.md and
# rules/registry.toml.
select = ["ALL"]
ignore = [
    # These conflict with ruff format; ruff's documentation says to disable
    # them when using the formatter.
    "COM812", "ISC001",
    # Mutually exclusive pydocstyle pairs: keep D211 (no blank line before a
    # class docstring) and D212 (summary on the first line).
    "D203", "D213",
]

[tool.ruff.lint.per-file-ignores]
# File-level exceptions are allowed only for tests, CI/CD scripts and
# command-line scripts; the rules guard checks each pattern covers nothing else
# (docs/engineering/skills/rules-registry.md#file-level-exceptions).
# Tests may use pytest's bare assert, and need no docstrings, annotations or
# named constants for magic numbers. They may also reach into private members,
# live in directories that aren't packages, import inside a test (often after
# patching the environment), and use fake credentials, naive datetimes,
# subprocess calls to repository scripts, SQL built from strings and prints,
# may import the lazily loaded packages at module level, may name a fake's
# methods after the interface it replaces, and may leave a stand-in's
# arguments unused. Every other rule applies to tests.
"**/tests/**" = [
    "ANN", "ARG001", "ARG002", "ARG005", "D1", "DTZ001", "DTZ011", "INP001",
    "N802", "PLC0415", "PLR2004", "S101", "S105", "S106", "S603", "S607",
    "S608", "SLF001", "T201", "TID253",
]
# The shared rules tool needs only the standard library, so its tests use
# unittest on purpose; pytest-style rules don't apply to them.
"scripts/rules/tests/**" = ["PT"]
# CI/CD scripts print their results, run other programs (such as gh), fetch
# fixed URLs, may have hyphenated file names and may import the lazily loaded
# packages at module level.
".github/**" = ["N999", "S310", "S603", "S607", "T201", "TID253"]
# Command-line scripts print their output, run other programs, fetch fixed
# URLs, stamp today's date and pick random samples.
"scripts/**" = [
    "DTZ011", "S310", "S311", "S603", "S607", "T201",
]
# Modules that also run as command-line programs print their output.
"policyengine_api/{data/v2/catalog/initialization,data/v2/household_migration_qualification,data/v2/policy_migration_qualification,data/v2/privilege_reconciliation,data/v2/user_association_migration_qualification,worker_spm_release}.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = [
    "policyengine_api/query_parameters.py",
    "policyengine_api/fastapi_routes/query_parameters.py",
    "policyengine_api/fastapi_routes/dependencies.py",
    "policyengine_api/fastapi_routes/metadata_protocols.py",
    "policyengine_api/fastapi_routes/resource_service_protocols.py",
    "policyengine_api/fastapi_routes/v2",
    "policyengine_api/services/v2",
    "policyengine_api/content_encoding.py",
    "policyengine_api/libs/user_auth.py",
    "policyengine_api/libs/auth0_management.py",
    "policyengine_api/libs/rate_limit_wait_budget.py",
    "policyengine_api/startup_country_check.py",
    "policyengine_api/supported_countries.py",
]
explicit_package_bases = true
follow_imports = "silent"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

# Import Linter checks which v2 modules may import which, directly or through
# other modules (docs/engineering/skills/v2-code-organization.md). Each contract
# is a rule in rules/registry.toml (enforcer kind import-linter), and CI runs
# `lint-imports` in the quality-guards job. Imports made only under
# TYPE_CHECKING count too, so moving an import there can't pass a contract.
#
# A contract's ignore_imports must equal its rule's baseline file under
# rules/baselines/ plus the rule's enforcer.allowed_ignore_imports; the rules
# guard fails otherwise, and baseline entries may not use wildcards.
# unmatched_ignore_imports_alerting = "error" makes an exception that no longer
# matches fail, so the lists only shrink. An exception covers every import
# between its two modules, not one import statement.
[tool.importlinter]
root_package = "policyengine_api"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = "api-v2-layers"
name = "v2 routes import v2 services and data, and v2 services import v2 data, never the reverse (rule api.v2.import-layers)"
type = "layers"
layers = [
    "policyengine_api.fastapi_routes.v2",
    "policyengine_api.services.v2",
    "policyengine_api.data.v2",
]

[[tool.importlinter.contracts]]
id = "api-v2-pure-modules-no-database"
name = "v2 validators, transformations and types reach no SQLAlchemy, SQLModel, connector, session or v2 database module except through the table models (rule api.v2.pure-modules-no-database)"
type = "forbidden"
source_modules = [
    "policyengine_api.services.v2.**.validators",
    "policyengine_api.services.v2.**.transformations",
    "policyengine_api.services.v2.**.types",
]
forbidden_modules = [
    "sqlalchemy",
    "sqlmodel",
    "policyengine_api.services.v2.**.database_connectors",
    "policyengine_api.services.v2.**.database_session",
    "policyengine_api.data.v2.database",
]
ignore_imports = [
    # Allowed by design: validators and transformations may use loaded table
    # rows, and the table models are SQLModel classes. Each model module is
    # listed, so a new module in the models package needs a registry change.
    "policyengine_api.data.v2.models -> sqlmodel",
    "policyengine_api.data.v2.models.associations -> sqlalchemy",
    "policyengine_api.data.v2.models.associations -> sqlmodel",
    "policyengine_api.data.v2.models.base -> sqlalchemy",
    "policyengine_api.data.v2.models.base -> sqlmodel",
    "policyengine_api.data.v2.models.comparison_runs -> sqlalchemy",
    "policyengine_api.data.v2.models.comparison_runs -> sqlmodel",
    "policyengine_api.data.v2.models.countries -> sqlalchemy",
    "policyengine_api.data.v2.models.countries -> sqlmodel",
    "policyengine_api.data.v2.models.household_mappings -> sqlalchemy",
    "policyengine_api.data.v2.models.household_mappings -> sqlmodel",
    "policyengine_api.data.v2.models.households -> sqlalchemy",
    "policyengine_api.data.v2.models.households -> sqlmodel",
    "policyengine_api.data.v2.models.metadata -> sqlalchemy",
    "policyengine_api.data.v2.models.metadata -> sqlmodel",
    "policyengine_api.data.v2.models.policies -> sqlalchemy",
    "policyengine_api.data.v2.models.policies -> sqlmodel",
    "policyengine_api.data.v2.models.policy_mappings -> sqlalchemy",
    "policyengine_api.data.v2.models.policy_mappings -> sqlmodel",
    "policyengine_api.data.v2.models.reports -> sqlalchemy",
    "policyengine_api.data.v2.models.reports -> sqlmodel",
    "policyengine_api.data.v2.models.run_results -> sqlalchemy",
    "policyengine_api.data.v2.models.run_results -> sqlmodel",
    "policyengine_api.data.v2.models.simulations -> sqlalchemy",
    "policyengine_api.data.v2.models.simulations -> sqlmodel",
    "policyengine_api.data.v2.models.users -> sqlalchemy",
    "policyengine_api.data.v2.models.users -> sqlmodel",
    # Tolerated: rules/baselines/import-linter-api-v2-pure-modules-no-database.txt
    "policyengine_api.services.v2.identity.types -> sqlmodel",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "api-v2-routes-no-database-access"
name = "v2 route modules import no connector, database_session or v2 database module (rule api.v2.routes-import-no-database-access)"
type = "forbidden"
source_modules = ["policyengine_api.fastapi_routes.v2"]
forbidden_modules = [
    "policyengine_api.services.v2.**.database_connectors",
    "policyengine_api.services.v2.**.database_session",
    "policyengine_api.data.v2.database",
]
# Direct imports only. Route modules reach connectors and session modules
# through fastapi_routes/dependencies.py, which builds each service with its
# session, and through the services they call. What routes call is the
# concern of rule api.v2.routes-no-sessions-or-sql.
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "api-v2-types-transformations-no-validators"
name = "v2 types and transformations import no validators module (rule api.v2.types-transformations-no-validators)"
type = "forbidden"
source_modules = [
    "policyengine_api.services.v2.**.types",
    "policyengine_api.services.v2.**.transformations",
]
forbidden_modules = ["policyengine_api.services.v2.**.validators"]
ignore_imports = [
    # Tolerated: rules/baselines/import-linter-api-v2-types-transformations-no-validators.txt
    "policyengine_api.services.v2.households.transformations -> policyengine_api.services.v2.households.validators",
    "policyengine_api.services.v2.households.types -> policyengine_api.services.v2.households.validators",
    "policyengine_api.services.v2.policies.transformations -> policyengine_api.services.v2.policies.validators",
    "policyengine_api.services.v2.policies.types -> policyengine_api.services.v2.policies.validators",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "api-v2-connectors-independent"
name = "v2 connector modules import no other connector module (rule api.v2.connectors-no-cross-calls)"
type = "independence"
modules = ["policyengine_api.services.v2.**.database_connectors.**"]
ignore_imports = [
    # Tolerated: rules/baselines/import-linter-api-v2-connectors-independent.txt
    "policyengine_api.services.v2.metadata.database_connectors.reads_datasets -> policyengine_api.services.v2.metadata.database_connectors.reads",
    "policyengine_api.services.v2.metadata.database_connectors.reads_parameter_nodes -> policyengine_api.services.v2.metadata.database_connectors.reads",
    "policyengine_api.services.v2.metadata.database_connectors.reads_parameter_search_file -> policyengine_api.services.v2.metadata.database_connectors.reads",
    "policyengine_api.services.v2.metadata.database_connectors.reads_parameter_tree -> policyengine_api.services.v2.metadata.database_connectors.reads",
    "policyengine_api.services.v2.metadata.database_connectors.reads_parameters -> policyengine_api.services.v2.metadata.database_connectors.reads",
    "policyengine_api.services.v2.metadata.database_connectors.reads_regions -> policyengine_api.services.v2.metadata.database_connectors.reads",
    "policyengine_api.services.v2.metadata.database_connectors.reads_variables -> policyengine_api.services.v2.metadata.database_connectors.reads",
]
unmatched_ignore_imports_alerting = "error"

# .github/changelog_fragments.py reads `directory` and the types' `directory`
# names below, so the PR check, the version bump in .github/bump_version.py and
# Towncrier share one list (rule api.process.changelog-fragment). Adding or
# removing a type also needs its entry in BUMP_BY_TYPE in bump_version.py,
# which refuses to run otherwise.
[tool.towncrier]
package = "policyengine_api"
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
issue_format = ""
underlines = ["", "", ""]
# With an ignore list, Towncrier fails on any other file in changelog.d/, such as
# a folder or a file with an unknown type, instead of skipping it.
ignore = [".gitkeep"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
[tool.ruff.lint.flake8-tidy-imports]
# Packages and modules that load only inside the function that needs them,
# never at module level (TID253 enforces it; TYPE_CHECKING imports are fine):
# policyengine and spm_calculator load country models, the v2 database module
# registers an exit hook at import, the v2 database sessions and services load
# persistence only when a default factory runs, the household calculation
# client of the simulation service loads only when a calculation is submitted,
# and Auth0 Management and the Google Secret Manager client load only when a
# secret is read. Ruff's PLC0415
# accepts in-function imports of these without a suppression. A module belongs
# here only if no application module imports it at module level.
banned-module-level-imports = [
    "google.cloud.secretmanager",
    "policyengine",
    "policyengine_api.data.v2.database",
    "policyengine_api.libs.auth0_management",
    "policyengine_api.libs.simulation_household_calculations",
    "policyengine_api.libs.simulation_reports",
    "policyengine_api.services.v2.countries.database_session",
    "policyengine_api.services.v2.countries.services",
    "policyengine_api.services.v2.household_calculations.database_session",
    "policyengine_api.services.v2.household_calculations.services",
    "policyengine_api.services.v2.households.database_session",
    "policyengine_api.services.v2.households.services",
    "policyengine_api.services.v2.legacy_refs.database_session",
    "policyengine_api.services.v2.legacy_refs.services",
    "policyengine_api.services.v2.metadata.database_session",
    "policyengine_api.services.v2.metadata.services",
    "policyengine_api.services.v2.policies.database_session",
    "policyengine_api.services.v2.policies.services",
    "policyengine_api.services.v2.simulation_service.services",
    "policyengine_api.services.v2.stored_reports.database_session",
    "policyengine_api.services.v2.stored_reports.services",
    "policyengine_api.services.v2.stored_simulations.database_session",
    "policyengine_api.services.v2.stored_simulations.services",
    "policyengine_api.services.v2.user_accounts.database_session",
    "policyengine_api.services.v2.user_accounts.services",
    "policyengine_api.services.v2.user_households.database_session",
    "policyengine_api.services.v2.user_households.services",
    "policyengine_api.services.v2.user_policies.database_session",
    "policyengine_api.services.v2.user_policies.services",
    "policyengine_api.services.v2.user_reports.database_session",
    "policyengine_api.services.v2.user_reports.services",
    "policyengine_api.services.v2.user_simulations.database_session",
    "policyengine_api.services.v2.user_simulations.services",
    "policyengine_api.services.v2.user_types.database_session",
    "policyengine_api.services.v2.user_types.services",
    "spm_calculator",
]

[tool.ruff.lint.flake8-type-checking]
# Classes whose annotations Pydantic, SQLModel or SQLAlchemy evaluate at runtime, so their
# imports must stay at runtime. Ruff checks direct bases only, so every
# project class that other models inherit from is listed.
runtime-evaluated-base-classes = [
    "policyengine_api.data.v2.models.base.IdentifiedModel",
