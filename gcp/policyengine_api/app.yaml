runtime: custom
env: flex
resources:
  cpu: 4
  memory_gb: 24
  disk_size_gb: 32
automatic_scaling:
  min_num_instances: 1
  max_num_instances: 1
  cool_down_period_sec: 180
  cpu_utilization:
    target_utilization: 0.8
liveness_check:
  path: "/liveness-check"
  check_interval_sec: 30 # Check every 30 seconds
  timeout_sec: 30 # Allow 30 seconds for a response
  failure_threshold: 5
  success_threshold: 2
  initial_delay_sec: 1800 # Allow non-preloaded workers to finish importing
runtime_config:
  operating_system: "ubuntu22"
  runtime_version: "22"
network:
  name: default
env_variables:
  POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ".policyengine_db_instance_connection_name"
  POLICYENGINE_DB_PASSWORD_SECRET_RESOURCE: ".policyengine_db_password_secret_resource"
  POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN_SECRET_RESOURCE: ".policyengine_github_microdata_auth_token_secret_resource"
  ANTHROPIC_API_KEY_SECRET_RESOURCE: ".anthropic_api_key_secret_resource"
  OPENAI_API_KEY_SECRET_RESOURCE: ".openai_api_key_secret_resource"
  HUGGING_FACE_TOKEN_SECRET_RESOURCE: ".hugging_face_token_secret_resource"
  SIMULATION_ENTRYPOINT_URL: ".simulation_entrypoint_url"
  OLD_SIMULATION_GATEWAY_URL: ".old_simulation_gateway_url"
  SIM_ENTRYPOINT: ".sim_entrypoint"
  GATEWAY_AUTH_REQUIRED: "1"
  GATEWAY_AUTH_ISSUER: ".gateway_auth_issuer"
  GATEWAY_AUTH_AUDIENCE: ".gateway_auth_audience"
  GATEWAY_AUTH_CLIENT_ID: ".gateway_auth_client_id"
  GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ".gateway_auth_client_secret_resource"
  RUNTIME_CACHE_MODE: "deployed"
  RUNTIME_CACHE_ENVIRONMENT: ".runtime_cache_environment"
  RUNTIME_CACHE_SERVICE: "api"
  RUNTIME_CACHE_URL_SECRET_RESOURCE: ".runtime_cache_url_secret_resource"
  RUNTIME_CACHE_CA_CERT_SECRET_RESOURCE: ".runtime_cache_ca_cert_secret_resource"
  V2_SUPABASE_PROJECT_REF: ".v2_supabase_project_ref"
  V2_SUPABASE_ENVIRONMENT: ".v2_supabase_environment"
readiness_check:
  path: "/readiness-check"
  check_interval_sec: 30
  timeout_sec: 30
  failure_threshold: 5
  success_threshold: 2
  app_start_timeout_sec: 1800
