name: policyengine-stage7-toy

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: policyengine_stage7_toy
      MYSQL_PASSWORD: policyengine
      MYSQL_ROOT_PASSWORD: policyengine-root
      MYSQL_USER: policyengine
    ports:
      - "127.0.0.1:${STAGE7_TOY_MYSQL_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=policyengine --password=policyengine --silent
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
