name: Pull request

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  OLD_SIMULATION_GATEWAY_URL: ${{ vars.OLD_SIMULATION_GATEWAY_URL }}

jobs:
  ci-complete:
    # The required check. Needs every other job: on a stacked pull request
    # above the lowest unmerged one it fails, because those jobs were skipped
    # and a skipped job would count as passing; otherwise it passes only when
    # every job passed. See docs/engineering/skills/github-prs.md.
    name: CI complete
    if: ${{ always() }}
    needs:
      - ensure-policyengine-bundle-supported-by-simulation-api
      - lint
      - typecheck-v2
      - quality-guards
      - alembic-v1-check
      - alembic-v2-check
      - v2-integration-check
      - check-changelog
      - test_container_builds
      - test_cloud_run_container_builds
      - test_env_vars
      - test
      - check-test-shards
      - upload-test-coverage
      - upload-integration-coverage
      - diff-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the gate script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/check_ci_complete.sh
          sparse-checkout-cone-mode: false
      - name: Require full CI, with every job passing
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref }}
        run: bash .github/scripts/check_ci_complete.sh

  ensure-policyengine-bundle-supported-by-simulation-api:
    name: Ensure PolicyEngine bundle is the simulation API's latest
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Set up uv for installed bundle validation
        uses: astral-sh/setup-uv@v6
      - name: Check the PolicyEngine bundle is the simulation API's latest
        run: bash .github/check-policyengine-bundle-supported.sh

  lint:
    name: Lint
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (version pinned in uv.lock)
        run: bash .github/scripts/install_locked_ruff.sh
      - name: Format check with ruff
        run: ruff format --check .
      - name: Lint with ruff
        run: ruff check .
  typecheck-v2:
    name: Type-check API v2
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Type-check API v2
        run: uv run --frozen --extra dev mypy
  quality-guards:
    name: Quality guards
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    env:
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The rules registry guard compares baselines with the base branch.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same uv version as the Cloud Run image and the release job.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Test the rules registry tool
        run: uv run --frozen --extra dev python -m unittest discover -s scripts/rules/tests -t .
      # The v2 import contracts in [tool.importlinter] in pyproject.toml.
      - name: Check v2 import contracts with Import Linter
        run: uv run --frozen --extra dev lint-imports --config pyproject.toml
      - name: Install shellcheck (for the ci-scripts guard)
        run: pip install "shellcheck-py==0.11.0.1"
      - name: Run quality guards
        run: python scripts/run_quality_guards.py

  alembic-v1-check:
    name: Alembic v1 qualification
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    uses: ./.github/workflows/alembic-v1-check.yml
  alembic-v2-check:
    name: Alembic v2 qualification
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    uses: ./.github/workflows/alembic-v2-check.yml
  v2-integration-check:
    name: Cross-database integration tests
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    uses: ./.github/workflows/v2-integration-check.yml
  check-changelog:
    # Rule api.process.changelog-fragment: every pull request adds a changelog
    # fragment the release can read. See
    # docs/engineering/skills/github-prs.md#changelog-fragments.
    name: Check changelog fragment
    # Full CI runs only on the lowest unmerged pull request in a stack.
    if: ${{ !github.event.pull_request.stack || github.event.pull_request.stack.base.ref == github.event.pull_request.base.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The check compares the checked-out merge commit with the pull
          # request's base commit, so it needs the base branch's history.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for changelog fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check_changelog_fragment.sh
  test_container_builds:
    name: Docker
    runs-on: ubuntu-latest
    needs: ensure-policyengine-bundle-supported-by-simulation-api
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: docker build -t ghcr.io/policyengine/policyengine docker
  test_cloud_run_container_builds:
    name: Cloud Run container
    runs-on: ubuntu-latest
    needs: ensure-policyengine-bundle-supported-by-simulation-api
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Build Cloud Run container
        run: docker build -f gcp/cloud_run/Dockerfile -t policyengine-api-cloud-run:test .
  test_env_vars:
    name: Test environment variables
    runs-on: ubuntu-latest
    needs: ensure-policyengine-bundle-supported-by-simulation-api
    permissions:
      contents: read
      id-token: write
    env:
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Wait until PolicyEngine bundle version is available on PyPI
        run: .github/wait-for-pypi.sh
      - name: Install locked dependencies
        run: make install
      - name: Run environment variable tests
        run: uv run --frozen --extra dev pytest tests/env_variables/test_environment_variables.py
        env:
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          # Compatibility name required by PolicyEngine Core. The GitHub
          # credential name describes its provider, data, and read-only scope.
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
          POLICYENGINE_DB_PASSWORD: ${{ secrets.POLICYENGINE_DB_PASSWORD }}
  test:
    # make test on six runners, one shard each, split by file as push.yml's
    # release-tests job splits it (scripts/release_test_shards.py), so a
    # change that breaks the split fails here, before it merges.
    # check-test-shards checks that each test ran in exactly one shard.
    name: Test (shard ${{ matrix.shard_index }} of 6)
    runs-on: ubuntu-latest
    needs:
      - ensure-policyengine-bundle-supported-by-simulation-api
      - test_env_vars
    permissions:
      contents: read
      id-token: write
    env:
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    strategy:
      # Every shard runs to the end, so one run shows every failure.
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Update package lists
        run: sudo apt-get update
      - name: Install system dependencies
        run: sudo apt-get install -y redis-server
      - name: Start Redis
        run: sudo systemctl start redis-server
      - name: Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: policyengine-api
      - name: Install locked dependencies
        run: make install
      # PYTEST_ADDOPTS loads the shard plugin as run_release_tests.sh does.
      - name: Test the API
        run: make test
        env:
          PYTEST_ADDOPTS: -p tests.release_test_shard_plugin
          RELEASE_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
          RELEASE_TEST_SHARD_COUNT: "6"
          RELEASE_TEST_SHARD_REPORT_DIRECTORY: ${{ runner.temp }}/release-test-shard
          POLICYENGINE_DB_PASSWORD: ${{ secrets.POLICYENGINE_DB_PASSWORD }}
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
      - name: Upload the tests this shard collected and ran
        uses: actions/upload-artifact@v4
        with:
          name: release-test-shard-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/release-test-shard
          if-no-files-found: error
          retention-days: 7
      # upload-test-coverage sends every shard's report to Codecov at once.
      - name: Keep this shard's coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-shard-${{ matrix.shard_index }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  upload-test-coverage:
    # Sends the six shards' coverage reports to Codecov in one upload, so
    # Codecov gets one upload for the test suite, as it did before the suite
    # was split. With an upload from each shard, Codecov updated its checks
    # after each upload and left codecov/patch in progress on #4145.
    name: Upload the test coverage to Codecov
    runs-on: ubuntu-latest
    # The Codecov action sets no network timeouts, so a stalled upload would
    # otherwise run until GitHub's 360-minute default.
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download every shard's coverage report
        uses: actions/download-artifact@v4
        with:
          pattern: test-coverage-shard-*
          path: ${{ runner.temp }}/test-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: PolicyEngine/policyengine-api
          directory: ${{ runner.temp }}/test-coverage
          # codecov.yml defines the flag and carries it forward.
          flags: unit

  upload-integration-coverage:
    # Sends the cross-database integration tests' coverage report, which
    # v2-integration-check.yml keeps as an artifact, to Codecov flagged
    # integration.
    name: Upload the integration test coverage to Codecov
    runs-on: ubuntu-latest
    # The Codecov action sets no network timeouts, so a stalled upload would
    # otherwise run until GitHub's 360-minute default.
    timeout-minutes: 10
    needs: v2-integration-check
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Download the integration coverage report
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: ${{ runner.temp }}/integration-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: PolicyEngine/policyengine-api
          directory: ${{ runner.temp }}/integration-coverage
          # codecov.yml defines the flag and carries it forward.
          flags: integration

  diff-coverage:
    # Rule api.quality.diff-coverage: at least 80% of the lines a pull request
    # changes in policyengine_api (.coveragerc's source) run in the unit or
    # integration tests. diff-cover reads every test shard's report and the
    # integration tests' report, and counts a line as covered if any of them
    # covers it. Its log lists the uncovered lines.
    name: Check the coverage of the changed lines
    runs-on: ubuntu-latest
    needs:
      - test
      - v2-integration-check
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # diff-cover compares with the pull request's base commit.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Download every test shard's coverage report
        uses: actions/download-artifact@v4
        with:
          pattern: test-coverage-shard-*
          path: ${{ runner.temp }}/coverage
      - name: Download the integration coverage report
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: ${{ runner.temp }}/coverage/integration-coverage
      - name: Check the coverage of the changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen --extra dev diff-cover "$RUNNER_TEMP"/coverage/*/coverage*.xml --compare-branch="$BASE_SHA" --fail-under=80

  check-test-shards:
    # Fails unless every shard collected the same tests and each test ran in
    # exactly one shard (scripts/release_test_shards.py check-coverage). It
    # needs every shard, so it is skipped when one fails, and CI complete
    # fails with it.
    name: Check that every test ran in exactly one shard
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download every shard's report
        uses: actions/download-artifact@v4
        with:
          pattern: release-test-shard-*
          path: ${{ runner.temp }}/release-test-shards
      - name: Check that every release test ran in exactly one shard
        run: python -m scripts.release_test_shards check-coverage --shard-count 6 "${{ runner.temp }}/release-test-shards"
