name: Push

on:
  push:
    branches:
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  OLD_SIMULATION_GATEWAY_URL: ${{ vars.OLD_SIMULATION_GATEWAY_URL }}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.repository == 'PolicyEngine/policyengine-api'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
      - name: Install ruff
        run: pip install ruff>=0.9.0
      - name: Format check with ruff
        run: ruff format --check .

  alembic-v1-check:
    name: Alembic v1 qualification
    if: github.repository == 'PolicyEngine/policyengine-api'
    uses: ./.github/workflows/alembic-v1-check.yml

  alembic-v2-check:
    name: Alembic v2 qualification
    if: github.repository == 'PolicyEngine/policyengine-api'
    uses: ./.github/workflows/alembic-v2-check.yml

  v2-integration-check:
    name: V2 integration qualification
    if: github.repository == 'PolicyEngine/policyengine-api'
    uses: ./.github/workflows/v2-integration-check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ensure-staging-model-version-aligns-with-sim-api:
    name: Ensure staging model version aligns with simulation API
    runs-on: ubuntu-latest
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    env:
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Check simulation API supports PolicyEngine bundle
        run: bash .github/check-policyengine-bundle-supported.sh

  versioning:
    name: Update versioning
    needs:
      - lint
      - alembic-v1-check
      - alembic-v2-check
      - v2-integration-check
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && !(github.event.head_commit.message == 'Update PolicyEngine API')
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build changelog
        run: |
          pip install towncrier
          python .github/bump_version.py
          towncrier build --yes --version "$(python -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")"
      - name: Preview changelog update
        run: ".github/get-changelog-diff.sh"
      - name: Update changelog
        uses: EndBug/add-and-commit@v9
        with:
          add: "."
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine API

  publish-git-tag:
    name: Publish Git Tag
    runs-on: ubuntu-latest
    needs:
      - ensure-staging-model-version-aligns-with-sim-api
      - lint
      - alembic-v1-check
      - alembic-v2-check
      - v2-integration-check
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish Git Tag
        run: ".github/publish-git-tag.sh"

  migrate-v1-staging-cloud-sql:
    name: Upgrade staging v1 Cloud SQL schema
    needs:
      - ensure-staging-model-version-aligns-with-sim-api
      - publish-git-tag
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    uses: ./.github/workflows/migrate-v1-cloud-sql.yml
    with:
      deployment_environment: staging
      github_environment: staging-database
    secrets: inherit

  seed-v2-staging-database:
    name: Seed staging v2 database
    needs:
      - publish-git-tag
      - migrate-v1-staging-cloud-sql
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    uses: ./.github/workflows/seed-v2-database.yml
    with:
      deployment_environment: staging
    secrets: inherit

  deploy-cloud-run-staging:
    name: Deploy staging Cloud Run candidate
    runs-on: ubuntu-latest
    needs:
      - ensure-staging-model-version-aligns-with-sim-api
      - publish-git-tag
      - migrate-v1-staging-cloud-sql
      - seed-v2-staging-database
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    env:
      DEPLOYMENT_ENVIRONMENT: staging
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
      CLOUD_RUN_SERVICE: policyengine-api-staging
      CLOUD_RUN_RUNTIME_CACHE_ENVIRONMENT: staging
      CLOUD_RUN_RUNTIME_CACHE_URL_SECRET: policyengine-api-staging-runtime-cache-url:latest
      CLOUD_RUN_RUNTIME_CACHE_CA_CERT_SECRET: policyengine-api-staging-runtime-cache-ca:latest
      CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      PRODUCTION_V2_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_V2_SUPABASE_PROJECT_REF }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      # Staging stays scale-to-zero, single instance: it exists for per-push
      # validation, not capacity. Both the revision-level (--min-instances) and
      # service-level (--min) floors are 0.
      CLOUD_RUN_MIN_INSTANCES: "0"
      CLOUD_RUN_SERVICE_MIN_INSTANCES: "0"
      CLOUD_RUN_MAX_INSTANCES: "1"
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.cloud_run.outputs.revision_tag }}
      url: ${{ steps.candidate.outputs.url }}
      revision: ${{ steps.candidate.outputs.revision }}
      image: ${{ steps.candidate.outputs.image }}
      stable_url: ${{ steps.previous.outputs.stable_url }}
      previous_revision: ${{ steps.previous.outputs.revision }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release test dependencies
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Start release test Redis
        run: sudo systemctl start redis-server
      - name: Install application dependencies
        run: make install
      - name: Run release tests
        run: >-
          env -u DEPLOYMENT_ENVIRONMENT -u ROUTE_IMPL_HEALTH -u ROUTE_IMPL_SPECIFICATION -u ROUTE_IMPL_METADATA -u ROUTE_IMPL_POLICY -u DB_READ_POLICY -u DB_WRITE_POLICY
          -u CLOUD_RUN_SERVICE -u CLOUD_RUN_RUNTIME_CACHE_ENVIRONMENT -u CLOUD_RUN_RUNTIME_CACHE_URL_SECRET -u CLOUD_RUN_RUNTIME_CACHE_CA_CERT_SECRET -u CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET -u CLOUD_RUN_MIN_INSTANCES -u CLOUD_RUN_SERVICE_MIN_INSTANCES -u CLOUD_RUN_MAX_INSTANCES
          -u V2_SUPABASE_PROJECT_REF -u V2_SUPABASE_ENVIRONMENT -u V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE -u PRODUCTION_V2_SUPABASE_PROJECT_REF -u PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE -u PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME make test
        env:
          RUNTIME_CACHE_MODE: local
          RUNTIME_CACHE_URL: redis://127.0.0.1:6379/0
          RUNTIME_CACHE_ENVIRONMENT: test
          RUNTIME_CACHE_SERVICE: api
          POLICYENGINE_DB_PASSWORD: ${{ secrets.POLICYENGINE_DB_PASSWORD }}
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Capture current Cloud Run staging state
        id: previous
        run: bash .github/scripts/capture_cloud_run_service_state.sh >> "$GITHUB_OUTPUT"
      - name: Compute Cloud Run staging metadata
        id: cloud_run
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # Short tag: Cloud Run caps tag + service name at 46 combined chars.
          echo "revision_tag=stg-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push Cloud Run image
        run: bash .github/scripts/build_cloud_run_image.sh
        env:
          CLOUD_RUN_IMAGE_TAG: ${{ steps.cloud_run.outputs.image_tag }}
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
      - name: Deploy tagged Cloud Run staging candidate
        run: bash .github/scripts/deploy_cloud_run_candidate.sh
        env:
          CLOUD_RUN_IMAGE_TAG: ${{ steps.cloud_run.outputs.image_tag }}
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: policyengine-api-cr-staging@policyengine-api.iam.gserviceaccount.com
          POLICYENGINE_DB_USER: ${{ vars.POLICYENGINE_DB_USER }}
          POLICYENGINE_DB_NAME: ${{ vars.POLICYENGINE_DB_NAME }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
      - name: Resolve exact Cloud Run staging candidate
        id: candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh >> "$GITHUB_OUTPUT"
        env:
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
      - name: Wait for Cloud Run staging health
        run: bash .github/scripts/health_check.sh "${{ steps.candidate.outputs.url }}/readiness-check"

  integration-tests-staging-cloud-run:
    name: Run Cloud Run staging integration tests
    runs-on: ubuntu-latest
    needs: deploy-cloud-run-staging
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install staging test dependencies
        run: pip install pytest httpx sqlalchemy psycopg[binary]
      - name: Run staging smoke test
        run: python -m pytest tests/integration/test_cloud_run_candidate.py tests/integration/test_live_v2_metadata.py tests/integration/test_live_v2_policies.py tests/integration/test_live_calculate.py tests/integration/test_live_economy.py tests/integration/test_live_budget_window_cache.py -v
        env:
          API_BASE_URL: ${{ needs.deploy-cloud-run-staging.outputs.url }}
          STAGING_API_TEST_PROBE_ID: cloud-run-${{ needs.deploy-cloud-run-staging.outputs.tag }}
          V2_MIGRATION_DATABASE_URL: ${{ secrets.V2_MIGRATION_DATABASE_URL }}

  promote-cloud-run-staging:
    name: Promote staging Cloud Run traffic
    runs-on: ubuntu-latest
    needs:
      - deploy-cloud-run-staging
      - integration-tests-staging-cloud-run
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    env:
      CLOUD_RUN_SERVICE: policyengine-api-staging
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Verify exact tested Cloud Run staging candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh
        env:
          CLOUD_RUN_TAG: ${{ needs.deploy-cloud-run-staging.outputs.tag }}
          CLOUD_RUN_EXPECTED_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          CLOUD_RUN_EXPECTED_IMAGE: ${{ needs.deploy-cloud-run-staging.outputs.image }}
      - name: Promote Cloud Run staging candidate
        id: promote
        continue-on-error: true
        run: bash .github/scripts/set_cloud_run_revision.sh
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.previous_revision }}
      - name: Wait for Cloud Run staging service health
        id: stable_health
        if: ${{ steps.promote.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/health_check.sh "${{ needs.deploy-cloud-run-staging.outputs.stable_url }}/readiness-check"
      - name: Restore previous Cloud Run staging revision
        if: ${{ steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure' }}
        run: |
          bash .github/scripts/set_cloud_run_revision.sh
          bash .github/scripts/health_check.sh "${{ needs.deploy-cloud-run-staging.outputs.stable_url }}/readiness-check"
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.previous_revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
      - name: Fail after unsuccessful Cloud Run staging promotion
        if: ${{ always() && (steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure') }}
        run: exit 1

  exercise-phase10-staging:
    name: Exercise Phase 10 activation, failure, retry, and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - deploy-cloud-run-staging
      - promote-cloud-run-staging
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    env:
      DEPLOYMENT_ENVIRONMENT: staging
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      POLICYENGINE_DB_READONLY_PASSWORD_SECRET: ${{ vars.POLICYENGINE_DB_READONLY_PASSWORD_SECRET }}
      POLICYENGINE_DB_MIGRATION_PASSWORD_SECRET: ${{ vars.POLICYENGINE_DB_MIGRATION_PASSWORD_SECRET }}
      PRODUCTION_POLICYENGINE_DB_READONLY_PASSWORD_SECRET: ${{ vars.PRODUCTION_POLICYENGINE_DB_READONLY_PASSWORD_SECRET }}
      PRODUCTION_POLICYENGINE_DB_MIGRATION_PASSWORD_SECRET: ${{ vars.PRODUCTION_POLICYENGINE_DB_MIGRATION_PASSWORD_SECRET }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
      CLOUD_RUN_SERVICE: policyengine-api-staging
      CLOUD_RUN_RUNTIME_CACHE_ENVIRONMENT: staging
      CLOUD_RUN_RUNTIME_CACHE_URL_SECRET: policyengine-api-staging-runtime-cache-url:latest
      CLOUD_RUN_RUNTIME_CACHE_CA_CERT_SECRET: policyengine-api-staging-runtime-cache-ca:latest
      CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      PRODUCTION_V2_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_V2_SUPABASE_PROJECT_REF }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      V2_FAILURE_DATABASE_URL_SECRET_RESOURCE: ${{ vars.V2_FAILURE_DATABASE_URL_SECRET_RESOURCE }}
      PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      CLOUD_RUN_MIN_INSTANCES: "0"
      CLOUD_RUN_SERVICE_MIN_INSTANCES: "0"
      CLOUD_RUN_MAX_INSTANCES: "1"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live exercise dependencies
        run: pip install pytest httpx sqlalchemy psycopg[binary] pymysql
      - name: Verify isolated Phase 10 exercise configuration
        run: bash .github/scripts/validate_phase10_staging_exercise_env.sh
      - name: Authenticate deployment identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up GCloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Compute exercise revision tags
        id: tags
        run: |
          echo "dual_write=p10-on-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "failure=p10-f-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Deploy dual-write staging revision
        run: bash .github/scripts/deploy_cloud_run_candidate.sh
        env:
          CLOUD_RUN_IMAGE_URI: ${{ needs.deploy-cloud-run-staging.outputs.image }}
          CLOUD_RUN_TAG: ${{ steps.tags.outputs.dual_write }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: policyengine-api-cr-staging@policyengine-api.iam.gserviceaccount.com
          POLICYENGINE_DB_USER: ${{ vars.POLICYENGINE_DB_USER }}
          POLICYENGINE_DB_NAME: ${{ vars.POLICYENGINE_DB_NAME }}
          DB_WRITE_POLICY: dual_write
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
      - name: Resolve exact dual-write staging revision
        id: dual_write
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh >> "$GITHUB_OUTPUT"
        env:
          CLOUD_RUN_TAG: ${{ steps.tags.outputs.dual_write }}
          DB_WRITE_POLICY: dual_write
      - name: Wait for dual-write revision health
        run: bash .github/scripts/health_check.sh "${{ steps.dual_write.outputs.url }}/readiness-check"
      - name: Promote dual-write staging revision
        id: promote_dual_write
        run: bash .github/scripts/set_cloud_run_revision.sh
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ steps.dual_write.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
      - name: Wait for dual-write stable URL health
        run: bash .github/scripts/health_check.sh "${{ needs.deploy-cloud-run-staging.outputs.stable_url }}/readiness-check"
      - name: Deploy controlled-failure staging revision
        run: bash .github/scripts/deploy_cloud_run_candidate.sh
        env:
          CLOUD_RUN_IMAGE_URI: ${{ needs.deploy-cloud-run-staging.outputs.image }}
          CLOUD_RUN_TAG: ${{ steps.tags.outputs.failure }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: policyengine-api-cr-staging@policyengine-api.iam.gserviceaccount.com
          POLICYENGINE_API_STARTUP_WARMUP: "0"
          POLICYENGINE_DB_USER: ${{ vars.POLICYENGINE_DB_USER }}
          POLICYENGINE_DB_NAME: ${{ vars.POLICYENGINE_DB_NAME }}
          DB_WRITE_POLICY: dual_write
          V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.V2_FAILURE_DATABASE_URL_SECRET_RESOURCE }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
      - name: Resolve exact controlled-failure staging revision
        id: failure
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh >> "$GITHUB_OUTPUT"
        env:
          CLOUD_RUN_TAG: ${{ steps.tags.outputs.failure }}
          DB_WRITE_POLICY: dual_write
          V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.V2_FAILURE_DATABASE_URL_SECRET_RESOURCE }}
      - name: Authenticate database inspection identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DB_MIGRATION_SERVICE_ACCOUNT }}
      - name: Start staging Cloud SQL Auth Proxy
        run: bash .github/scripts/start_cloud_sql_proxy.sh
      - name: Run activation, failure, and retry checks
        id: activation
        continue-on-error: true
        run: bash .github/scripts/run_phase10_staging_probe.sh activation
        env:
          API_BASE_URL: ${{ steps.dual_write.outputs.url }}
          PHASE10_FAILURE_API_BASE_URL: ${{ steps.failure.outputs.url }}
          PHASE10_STATE_PATH: ${{ runner.temp }}/phase10-staging-evidence.json
          PHASE10_CLOUD_SQL_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          PHASE10_DUAL_WRITE_REVISION: ${{ steps.dual_write.outputs.revision }}
          PHASE10_FAILURE_REVISION: ${{ steps.failure.outputs.revision }}
          RUN_PHASE10_STAGING_EXERCISE: "1"
          STAGING_API_TEST_PROBE_ID: phase10-${{ github.run_id }}-${{ github.run_attempt }}
          V2_MIGRATION_DATABASE_URL: ${{ secrets.V2_MIGRATION_DATABASE_URL }}
      - name: Stop staging Cloud SQL Auth Proxy after activation
        if: always()
        run: bash .github/scripts/stop_cloud_sql_proxy.sh
      - name: Reauthenticate deployment identity for rollback
        if: always() && steps.promote_dual_write.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Restore exact Cloud SQL-only staging revision
        id: rollback
        if: always() && steps.promote_dual_write.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/set_cloud_run_revision.sh
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ steps.dual_write.outputs.revision }}
      - name: Wait for restored staging revision health
        id: rollback_health
        if: always() && steps.rollback.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/health_check.sh "${{ needs.deploy-cloud-run-staging.outputs.stable_url }}/readiness-check"
      - name: Authenticate database inspection identity after rollback
        if: always() && steps.rollback_health.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DB_MIGRATION_SERVICE_ACCOUNT }}
      - name: Restart staging Cloud SQL Auth Proxy
        if: always() && steps.rollback_health.outcome == 'success'
        run: bash .github/scripts/start_cloud_sql_proxy.sh
      - name: Run Cloud SQL-only rollback checks
        id: rollback_probe
        if: always() && steps.activation.outcome == 'success' && steps.rollback_health.outcome == 'success'
        continue-on-error: true
        run: bash .github/scripts/run_phase10_staging_probe.sh rollback
        env:
          API_BASE_URL: ${{ needs.deploy-cloud-run-staging.outputs.stable_url }}
          PHASE10_STATE_PATH: ${{ runner.temp }}/phase10-staging-evidence.json
          PHASE10_CLOUD_SQL_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          RUN_PHASE10_STAGING_EXERCISE: "1"
          STAGING_API_TEST_PROBE_ID: phase10-${{ github.run_id }}-${{ github.run_attempt }}
          V2_MIGRATION_DATABASE_URL: ${{ secrets.V2_MIGRATION_DATABASE_URL }}
      - name: Stop staging Cloud SQL Auth Proxy after rollback
        if: always()
        run: bash .github/scripts/stop_cloud_sql_proxy.sh
      - name: Retain non-secret Phase 10 staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-staging-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase10-staging-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail after an incomplete Phase 10 staging exercise
        if: >-
          ${{ always() && (
            steps.activation.outcome != 'success'
            || steps.rollback.outcome != 'success'
            || steps.rollback_health.outcome != 'success'
            || steps.rollback_probe.outcome != 'success'
          ) }}
        run: exit 1

  ensure-production-model-version-aligns-with-sim-api:
    name: Ensure production model version aligns with simulation API
    runs-on: ubuntu-latest
    needs: exercise-phase10-staging
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: production
    env:
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Check simulation API supports PolicyEngine bundle
        run: bash .github/check-policyengine-bundle-supported.sh

  migrate-v1-production-cloud-sql:
    name: Upgrade production v1 Cloud SQL schema
    needs: ensure-production-model-version-aligns-with-sim-api
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    uses: ./.github/workflows/migrate-v1-cloud-sql.yml
    with:
      deployment_environment: production
      github_environment: production-database
    secrets: inherit

  seed-v2-production-database:
    name: Seed production v2 database
    needs:
      - ensure-production-model-version-aligns-with-sim-api
      - migrate-v1-production-cloud-sql
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    uses: ./.github/workflows/seed-v2-database.yml
    with:
      deployment_environment: production
    secrets: inherit

  deploy-cloud-run-candidate:
    name: Deploy production Cloud Run candidate
    runs-on: ubuntu-latest
    needs: seed-v2-production-database
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: production
    env:
      DEPLOYMENT_ENVIRONMENT: production
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
      CLOUD_RUN_SERVICE: policyengine-api
      CLOUD_RUN_RUNTIME_CACHE_ENVIRONMENT: production
      CLOUD_RUN_RUNTIME_CACHE_URL_SECRET: policyengine-api-prod-runtime-cache-url:latest
      CLOUD_RUN_RUNTIME_CACHE_CA_CERT_SECRET: policyengine-api-prod-runtime-cache-ca:latest
      CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      PRODUCTION_V2_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_V2_SUPABASE_PROJECT_REF }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      # Sized by the Stage 2 qualification and the PR 4 host cutover — rationale
      # and numbers in docs/migration/cloud-run-operations.md ("Runtime shape and
      # scaling"). Warm capacity is expressed service-level (--min); the
      # revision-level floor stays 0 (default in cloud_run_env.sh) to avoid
      # per-tag pinning. Max raised to 8 for the 100% Cloud Run cutover: at 50/50
      # the service was already pinned at the previous ceiling of 4 during the
      # daytime peak, so full traffic needs the extra headroom.
      CLOUD_RUN_SERVICE_MIN_INSTANCES: "2"
      CLOUD_RUN_MAX_INSTANCES: "8"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Capture current Cloud Run production state
        id: previous
        run: bash .github/scripts/capture_cloud_run_service_state.sh >> "$GITHUB_OUTPUT"
      - name: Compute Cloud Run candidate metadata
        id: cloud_run
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "revision_tag=stage3-prod-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Deploy tagged Cloud Run candidate
        run: bash .github/scripts/deploy_cloud_run_candidate.sh
        env:
          CLOUD_RUN_IMAGE_TAG: ${{ steps.cloud_run.outputs.image_tag }}
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
          POLICYENGINE_DB_USER: ${{ vars.POLICYENGINE_DB_USER }}
          POLICYENGINE_DB_NAME: ${{ vars.POLICYENGINE_DB_NAME }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
      - name: Resolve exact Cloud Run production candidate
        id: candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh >> "$GITHUB_OUTPUT"
        env:
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
      - name: Wait for Cloud Run candidate health
        run: bash .github/scripts/health_check.sh "${{ steps.candidate.outputs.url }}/readiness-check"
      - name: Install Cloud Run smoke test dependencies
        run: pip install pytest httpx
      - name: Run Cloud Run candidate smoke tests
        run: python -m pytest tests/integration/test_cloud_run_candidate.py tests/integration/test_live_v2_metadata.py -v
        env:
          API_BASE_URL: ${{ steps.candidate.outputs.url }}
          STAGING_API_TEST_PROBE_ID: cloud-run-${{ steps.cloud_run.outputs.revision_tag }}
      - name: Verify exact tested Cloud Run production candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh
        env:
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
          CLOUD_RUN_EXPECTED_REVISION: ${{ steps.candidate.outputs.revision }}
          CLOUD_RUN_EXPECTED_IMAGE: ${{ steps.candidate.outputs.image }}
      - name: Promote Cloud Run production candidate
        id: promote
        continue-on-error: true
        run: bash .github/scripts/set_cloud_run_revision.sh
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ steps.candidate.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ steps.previous.outputs.revision }}
      - name: Wait for Cloud Run production service health
        id: stable_health
        if: ${{ steps.promote.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/health_check.sh "${{ steps.previous.outputs.stable_url }}/readiness-check"
      - name: Restore previous Cloud Run production revision
        if: ${{ steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure' }}
        run: |
          bash .github/scripts/set_cloud_run_revision.sh
          bash .github/scripts/health_check.sh "${{ steps.previous.outputs.stable_url }}/readiness-check"
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ steps.previous.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ steps.candidate.outputs.revision }}
      - name: Fail after unsuccessful Cloud Run production promotion
        if: ${{ always() && (steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure') }}
        run: exit 1

  cleanup-cloud-run-images:
    name: Clean up old Cloud Run images
    runs-on: ubuntu-latest
    needs: deploy-cloud-run-candidate
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      # The Cloud Run deploy pushes a new image every release and nothing prunes
      # them, so the repo grows without bound. Keep the 15 most recent image
      # versions (default in the script) and delete older ones.
      - name: Prune old Cloud Run images
        run: bash .github/scripts/cleanup_cloud_run_images.sh

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: deploy-cloud-run-candidate
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: docker build -t ghcr.io/policyengine/policyengine docker
      - name: Push container
        run: docker push ghcr.io/policyengine/policyengine
