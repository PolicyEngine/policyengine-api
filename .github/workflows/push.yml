name: Version and deploy

on:
  push:
    branches:
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: github.repository == 'PolicyEngine/policyengine-api'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
      - name: Install ruff
        run: pip install ruff>=0.9.0
      - name: Format check with ruff
        run: ruff format --check .

  alembic-v1-check:
    name: Alembic v1 qualification
    if: github.repository == 'PolicyEngine/policyengine-api'
    uses: ./.github/workflows/alembic-v1-check.yml

  alembic-v2-check:
    name: Alembic v2 qualification
    if: github.repository == 'PolicyEngine/policyengine-api'
    uses: ./.github/workflows/alembic-v2-check.yml

  v2-integration-check:
    name: V2 integration qualification
    if: github.repository == 'PolicyEngine/policyengine-api'
    uses: ./.github/workflows/v2-integration-check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  versioning:
    name: Generate release commit
    needs:
      - lint
      - alembic-v1-check
      - alembic-v2-check
      - v2-integration-check
    if: github.repository == 'PolicyEngine/policyengine-api'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release-commit.outputs.commit_long_sha }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build changelog
        run: |
          pip install towncrier
          python .github/bump_version.py
          towncrier build --yes --version "$(python -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")"
      - name: Preview changelog update
        run: ".github/get-changelog-diff.sh"
      - name: Commit generated release
        id: release-commit
        uses: EndBug/add-and-commit@v9
        with:
          add: "."
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine API [skip ci]
      - name: Verify generated release commit
        if: steps.release-commit.outputs.committed != 'true'
        run: |
          echo "The release process did not generate a commit."
          exit 1

  deployment:
    name: Deploy generated release commit
    needs: versioning
    uses: ./.github/workflows/deployment.yml
    with:
      release_sha: ${{ needs.versioning.outputs.release_sha }}
    secrets: inherit
