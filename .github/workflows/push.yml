name: Push

on:
  push:
    branches:
      - master

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  OLD_SIMULATION_GATEWAY_URL: ${{ vars.OLD_SIMULATION_GATEWAY_URL }}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-release-commit:
    # Whether this release run may skip the checks its merge run passed: the
    # release commit changes only release files, and the merge commit's Push
    # run passed every check (.github/release_commit.py). It runs on every
    # push, so the checks that need it never need a skipped job; on a merge
    # commit its steps do nothing, and the checks run.
    name: Check the release commit
    runs-on: ubuntu-latest
    if: github.repository == 'PolicyEngine/policyengine-api'
    permissions:
      contents: read
      actions: read
    outputs:
      merge_run_checks_passed: ${{ steps.release_commit.outputs.merge_run_checks_passed }}
      merge_run_url: ${{ steps.release_commit.outputs.merge_run_url }}
    steps:
      - name: Checkout the release commit and its parent
        if: github.event.head_commit.message == 'Update PolicyEngine API'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        if: github.event.head_commit.message == 'Update PolicyEngine API'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether this run may skip the merge run's checks
        id: release_commit
        if: github.event.head_commit.message == 'Update PolicyEngine API'
        run: bash .github/scripts/check_release_commit.sh
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: check-release-commit
    # Skipped on a release run whose merge run passed it on the same code.
    # !cancelled() runs it when the release commit check fails.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (needs.check-release-commit.outputs.merge_run_checks_passed != 'true')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (version pinned in uv.lock)
        run: bash .github/scripts/install_locked_ruff.sh
      - name: Format check with ruff
        run: ruff format --check .
      - name: Lint with ruff
        run: ruff check .

  quality-guards:
    name: Quality guards
    runs-on: ubuntu-latest
    needs: check-release-commit
    # Skipped on a release run whose merge run passed it on the same code.
    # !cancelled() runs it when the release commit check fails.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (needs.check-release-commit.outputs.merge_run_checks_passed != 'true')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck (for the ci-scripts guard)
        run: pip install "shellcheck-py==0.11.0.1"
      - name: Run quality guards
        run: python scripts/run_quality_guards.py

  alembic-v1-check:
    name: Alembic v1 qualification
    needs: check-release-commit
    # Skipped on a release run whose merge run passed it on the same code.
    # !cancelled() runs it when the release commit check fails.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (needs.check-release-commit.outputs.merge_run_checks_passed != 'true')
    uses: ./.github/workflows/alembic-v1-check.yml

  alembic-v2-check:
    name: Alembic v2 qualification
    needs: check-release-commit
    # Skipped on a release run whose merge run passed it on the same code.
    # !cancelled() runs it when the release commit check fails.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (needs.check-release-commit.outputs.merge_run_checks_passed != 'true')
    uses: ./.github/workflows/alembic-v2-check.yml

  v2-integration-check:
    name: Cross-database integration tests
    needs: check-release-commit
    # Skipped on a release run whose merge run passed it on the same code.
    # !cancelled() runs it when the release commit check fails.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (needs.check-release-commit.outputs.merge_run_checks_passed != 'true')
    uses: ./.github/workflows/v2-integration-check.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ensure-staging-model-version-aligns-with-sim-api:
    name: Ensure staging model version aligns with simulation API
    runs-on: ubuntu-latest
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    env:
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Set up uv for installed bundle validation
        uses: astral-sh/setup-uv@v6
      - name: Check simulation API supports PolicyEngine bundle
        run: bash .github/check-policyengine-bundle-supported.sh

  versioning:
    name: Update versioning
    needs:
      - lint
      - alembic-v1-check
      - alembic-v2-check
      - v2-integration-check
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && !(github.event.head_commit.message == 'Update PolicyEngine API')
    runs-on: ubuntu-latest
    env:
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - name: Bump project version
        run: python .github/bump_version.py
      - name: Refresh uv lock
        run: uv lock
      - name: Build changelog
        run: bash .github/scripts/build_changelog.sh
      - name: Preview changelog update
        run: ".github/get-changelog-diff.sh"
      - name: Update changelog
        uses: EndBug/add-and-commit@v9
        with:
          add: "."
          committer_name: Github Actions[bot]
          author_name: Github Actions[bot]
          message: Update PolicyEngine API

  publish-git-tag:
    name: Publish Git Tag
    runs-on: ubuntu-latest
    needs:
      - ensure-staging-model-version-aligns-with-sim-api
      - check-release-commit
      - lint
      - alembic-v1-check
      - alembic-v2-check
      - v2-integration-check
    # The checks may be skipped, so this job runs whatever they ended, and its
    # first step after checkout requires that the merge run passed them on the
    # same code or that this run did. Every release job after it states which
    # jobs it needs to have passed: GitHub would otherwise skip it, because a
    # job it needs needed a skipped one.
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.ensure-staging-model-version-aligns-with-sim-api.result == 'success'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the merge run's checks or this run's
        run: python .github/release_commit.py require-checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
      - name: Publish Git Tag
        run: ".github/publish-git-tag.sh"

  migrate-v1-staging-cloud-sql:
    name: Upgrade staging v1 Cloud SQL schema
    needs:
      - ensure-staging-model-version-aligns-with-sim-api
      - publish-git-tag
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.ensure-staging-model-version-aligns-with-sim-api.result == 'success'
      && needs.publish-git-tag.result == 'success'
    uses: ./.github/workflows/migrate-v1-cloud-sql.yml
    with:
      deployment_environment: staging
      github_environment: staging-database
    secrets: inherit

  seed-v2-staging-database:
    # Runs beside migrate-v1-staging-cloud-sql: the seeding job connects only to
    # the v2 database and the v1 upgrade only to Cloud SQL, so neither needs the
    # other. The staging deploy needs both.
    name: Seed staging v2 database
    needs:
      - publish-git-tag
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.publish-git-tag.result == 'success'
    uses: ./.github/workflows/seed-v2-database.yml
    with:
      deployment_environment: staging
    secrets: inherit

  release-tests:
    # The release test suite (make test) on the release commit: the only run
    # of it on the merged code, because pull requests need not be up to date
    # with master to merge. It starts with the run, beside the checks and the
    # staging database jobs, and the staging deploy needs it, so the tests pass
    # before GCP authentication, image publication or candidate deployment.
    # It keeps the staging environment and the variables the tests read when
    # they ran inside the staging deploy job. The suite runs in six shards, one
    # runner each, split by file (scripts/release_test_shards.py), and
    # check-release-test-shards checks that each test ran in exactly one.
    name: Run release tests (shard ${{ matrix.shard_index }} of 6)
    runs-on: ubuntu-latest
    if: |
      (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
    environment: staging
    env:
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    permissions:
      contents: read
    strategy:
      # Every shard runs to the end, so one release run shows every failure.
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Update package lists
        run: sudo apt-get update
      - name: Install release test dependencies
        run: sudo apt-get install -y redis-server
      - name: Start release test Redis
        run: sudo systemctl start redis-server
      - name: Install locked application dependencies
        run: make install
      - name: Run release tests
        run: bash .github/scripts/run_release_tests.sh
        env:
          RELEASE_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
          RELEASE_TEST_SHARD_COUNT: "6"
          RELEASE_TEST_SHARD_REPORT_DIRECTORY: ${{ runner.temp }}/release-test-shard
          RUNTIME_CACHE_MODE: local
          RUNTIME_CACHE_URL: redis://127.0.0.1:6379/0
          RUNTIME_CACHE_ENVIRONMENT: test
          RUNTIME_CACHE_SERVICE: api
          POLICYENGINE_DB_PASSWORD: ${{ secrets.POLICYENGINE_DB_PASSWORD }}
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Compatibility name required by PolicyEngine Core.
          HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
      - name: Upload the tests this shard collected and ran
        uses: actions/upload-artifact@v4
        with:
          name: release-test-shard-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/release-test-shard
          if-no-files-found: error
          retention-days: 7

  check-release-test-shards:
    # Fails unless every shard collected the same tests and each test ran in
    # exactly one shard (scripts/release_test_shards.py check-coverage).
    name: Check that every release test ran in exactly one shard
    runs-on: ubuntu-latest
    needs: release-tests
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.release-tests.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download every shard's report
        uses: actions/download-artifact@v4
        with:
          pattern: release-test-shard-*
          path: ${{ runner.temp }}/release-test-shards
      - name: Check that every release test ran in exactly one shard
        run: python -m scripts.release_test_shards check-coverage --shard-count 6 "${{ runner.temp }}/release-test-shards"

  deploy-cloud-run-staging:
    name: Deploy and test staging Cloud Run candidate
    runs-on: ubuntu-latest
    needs:
      - ensure-staging-model-version-aligns-with-sim-api
      - publish-git-tag
      - migrate-v1-staging-cloud-sql
      - seed-v2-staging-database
      - release-tests
      - check-release-test-shards
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.ensure-staging-model-version-aligns-with-sim-api.result == 'success'
      && needs.publish-git-tag.result == 'success'
      && needs.migrate-v1-staging-cloud-sql.result == 'success'
      && needs.seed-v2-staging-database.result == 'success'
      && needs.release-tests.result == 'success'
      && needs.check-release-test-shards.result == 'success'
    environment: staging
    env:
      DEPLOYMENT_ENVIRONMENT: staging
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      ROUTE_IMPL_HOUSEHOLD: ${{ vars.ROUTE_IMPL_HOUSEHOLD }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
      DB_READ_HOUSEHOLD: ${{ vars.DB_READ_HOUSEHOLD }}
      DB_WRITE_HOUSEHOLD: ${{ vars.DB_WRITE_HOUSEHOLD }}
      PUBLIC_API_AUTH_REQUIRED: ${{ vars.PUBLIC_API_AUTH_REQUIRED }}
      PUBLIC_API_AUTH_ISSUER: ${{ vars.PUBLIC_API_AUTH_ISSUER }}
      PUBLIC_API_AUTH_AUDIENCE: ${{ vars.PUBLIC_API_AUTH_AUDIENCE }}
      CLOUD_RUN_SERVICE: policyengine-api-staging
      CLOUD_RUN_RUNTIME_CACHE_ENVIRONMENT: staging
      CLOUD_RUN_RUNTIME_CACHE_URL_SECRET: policyengine-api-staging-runtime-cache-url:latest
      CLOUD_RUN_RUNTIME_CACHE_CA_CERT_SECRET: policyengine-api-staging-runtime-cache-ca:latest
      CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      PRODUCTION_V2_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_V2_SUPABASE_PROJECT_REF }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      # Staging stays scale-to-zero, single instance: it exists for per-push
      # validation, not capacity. Both the revision-level (--min-instances) and
      # service-level (--min) floors are 0.
      CLOUD_RUN_MIN_INSTANCES: "0"
      CLOUD_RUN_SERVICE_MIN_INSTANCES: "0"
      CLOUD_RUN_MAX_INSTANCES: "1"
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.cloud_run.outputs.revision_tag }}
      url: ${{ steps.candidate.outputs.url }}
      revision: ${{ steps.candidate.outputs.revision }}
      image: ${{ steps.candidate.outputs.image }}
      stable_url: ${{ steps.previous.outputs.stable_url }}
      previous_revision: ${{ steps.previous.outputs.revision }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      # The staging integration tests below run from uv.lock.
      - name: Install locked application dependencies
        run: make install
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      # The staging database password is managed independently in Secret Manager
      # and differs from the repository-level production database password.
      - name: Synchronize shared Cloud Run runtime secrets
        env:
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PE_UK_PRIVATE_HF_READ_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
        run: bash .github/scripts/sync_cloud_run_secrets.sh
      - name: Capture current Cloud Run staging state
        id: previous
        run: bash .github/scripts/capture_cloud_run_service_state.sh >> "$GITHUB_OUTPUT"
      - name: Compute Cloud Run staging metadata
        id: cloud_run
        run: bash .github/scripts/compute_cloud_run_metadata.sh stg
      - name: Build and push Cloud Run image
        run: bash .github/scripts/build_cloud_run_image.sh
        env:
          CLOUD_RUN_IMAGE_TAG: ${{ steps.cloud_run.outputs.image_tag }}
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
      - name: Deploy tagged Cloud Run staging candidate
        run: bash .github/scripts/deploy_cloud_run_candidate.sh
        env:
          PREVIOUS_CLOUD_RUN_REVISION: ${{ steps.previous.outputs.revision }}
          CLOUD_RUN_IMAGE_TAG: ${{ steps.cloud_run.outputs.image_tag }}
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: policyengine-api-cr-staging@policyengine-api.iam.gserviceaccount.com
          POLICYENGINE_DB_USER: ${{ vars.POLICYENGINE_DB_USER }}
          POLICYENGINE_DB_NAME: ${{ vars.POLICYENGINE_DB_NAME }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
          OBSERVABILITY_SERVICE_NAMESPACE: ${{ vars.OBSERVABILITY_SERVICE_NAMESPACE }}
          OBSERVABILITY_TRACE_PROJECT_ID: ${{ vars.OBSERVABILITY_TRACE_PROJECT_ID }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT }}
          POLICYENGINE_OTEL_GOOGLE_AUDIENCE: ${{ vars.OBSERVABILITY_OTLP_GOOGLE_AUDIENCE }}
      - name: Resolve exact Cloud Run staging candidate
        id: candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh >> "$GITHUB_OUTPUT"
        env:
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
      - name: Wait for Cloud Run staging health
        run: bash .github/scripts/health_check.sh "${{ steps.candidate.outputs.url }}/readiness-check"
      - name: Run staging integration tests
        run: uv run --frozen --extra dev python -m pytest tests/integration/test_cloud_run_candidate.py tests/integration/test_live_v2_metadata.py tests/integration/test_live_v2_policies.py -v
        env:
          API_BASE_URL: ${{ steps.candidate.outputs.url }}
          STAGING_API_TEST_PROBE_ID: cloud-run-${{ steps.cloud_run.outputs.revision_tag }}
          V2_MIGRATION_DATABASE_URL: ${{ secrets.V2_MIGRATION_DATABASE_URL }}
          # Staging-only Auth0 CI application (password grant) and test user.
          STAGING_AUTH0_TEST_DOMAIN: ${{ vars.STAGING_AUTH0_TEST_DOMAIN }}
          STAGING_AUTH0_TEST_AUDIENCE: ${{ vars.STAGING_AUTH0_TEST_AUDIENCE }}
          STAGING_AUTH0_TEST_CLIENT_ID: ${{ secrets.STAGING_AUTH0_TEST_CLIENT_ID }}
          STAGING_AUTH0_TEST_CLIENT_SECRET: ${{ secrets.STAGING_AUTH0_TEST_CLIENT_SECRET }}
          STAGING_AUTH0_TEST_USERNAME: ${{ secrets.STAGING_AUTH0_TEST_USERNAME }}
          STAGING_AUTH0_TEST_PASSWORD: ${{ secrets.STAGING_AUTH0_TEST_PASSWORD }}
          STAGING_AUTH0_TEST_REALM: ${{ vars.STAGING_AUTH0_TEST_REALM }}

  parallel-live-simulation-tests-staging-cloud-run:
    name: Run live simulations against the staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy-cloud-run-staging
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.deploy-cloud-run-staging.result == 'success'
    env:
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked live test dependencies
        run: make install
      - name: Wait for Cloud Run staging candidate health before live tests
        run: bash .github/scripts/health_check.sh "${{ needs.deploy-cloud-run-staging.outputs.url }}/readiness-check"
      - name: Run live staging tests, one pytest worker per test
        run: bash .github/scripts/run_live_staging_tests.sh
        env:
          API_BASE_URL: ${{ needs.deploy-cloud-run-staging.outputs.url }}
          STAGING_API_TEST_PROBE_ID: cloud-run-${{ needs.deploy-cloud-run-staging.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}

  promote-cloud-run-staging:
    name: Promote staging Cloud Run traffic
    runs-on: ubuntu-latest
    needs:
      - deploy-cloud-run-staging
      - parallel-live-simulation-tests-staging-cloud-run
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.deploy-cloud-run-staging.result == 'success'
      && needs.parallel-live-simulation-tests-staging-cloud-run.result == 'success'
    environment: staging
    env:
      CLOUD_RUN_SERVICE: policyengine-api-staging
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      ROUTE_IMPL_HOUSEHOLD: ${{ vars.ROUTE_IMPL_HOUSEHOLD }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
      DB_READ_HOUSEHOLD: ${{ vars.DB_READ_HOUSEHOLD }}
      DB_WRITE_HOUSEHOLD: ${{ vars.DB_WRITE_HOUSEHOLD }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Verify exact tested Cloud Run staging candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh
        env:
          CLOUD_RUN_TAG: ${{ needs.deploy-cloud-run-staging.outputs.tag }}
          CLOUD_RUN_EXPECTED_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          CLOUD_RUN_EXPECTED_IMAGE: ${{ needs.deploy-cloud-run-staging.outputs.image }}
      - name: Promote Cloud Run staging candidate
        id: promote
        continue-on-error: true
        run: bash .github/scripts/set_cloud_run_revision.sh
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.previous_revision }}
      - name: Wait for Cloud Run staging service health
        id: stable_health
        if: ${{ steps.promote.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/health_check.sh "${{ needs.deploy-cloud-run-staging.outputs.stable_url }}/readiness-check"
      - name: Restore previous Cloud Run staging revision
        if: ${{ steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure' }}
        run: bash .github/scripts/restore_cloud_run_revision.sh "${{ needs.deploy-cloud-run-staging.outputs.stable_url }}/readiness-check"
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.previous_revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ needs.deploy-cloud-run-staging.outputs.revision }}
      - name: Fail after unsuccessful Cloud Run staging promotion
        if: ${{ always() && (steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure') }}
        run: exit 1

  ensure-production-model-version-aligns-with-sim-api:
    name: Ensure production model version aligns with simulation API
    runs-on: ubuntu-latest
    needs: promote-cloud-run-staging
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.promote-cloud-run-staging.result == 'success'
    environment: production
    env:
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Set up uv for installed bundle validation
        uses: astral-sh/setup-uv@v6
      - name: Check simulation API supports PolicyEngine bundle
        run: bash .github/check-policyengine-bundle-supported.sh

  migrate-v1-production-cloud-sql:
    name: Upgrade production v1 Cloud SQL schema
    needs: ensure-production-model-version-aligns-with-sim-api
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.ensure-production-model-version-aligns-with-sim-api.result == 'success'
    uses: ./.github/workflows/migrate-v1-cloud-sql.yml
    with:
      deployment_environment: production
      github_environment: production-database
    secrets: inherit

  seed-v2-production-database:
    # Runs beside migrate-v1-production-cloud-sql, as in staging. The
    # production deploy needs both.
    name: Seed production v2 database
    needs:
      - ensure-production-model-version-aligns-with-sim-api
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.ensure-production-model-version-aligns-with-sim-api.result == 'success'
    uses: ./.github/workflows/seed-v2-database.yml
    with:
      deployment_environment: production
    secrets: inherit

  deploy-cloud-run-candidate:
    name: Deploy production Cloud Run candidate
    runs-on: ubuntu-latest
    needs:
      - migrate-v1-production-cloud-sql
      - seed-v2-production-database
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.migrate-v1-production-cloud-sql.result == 'success'
      && needs.seed-v2-production-database.result == 'success'
    environment: production
    env:
      DEPLOYMENT_ENVIRONMENT: production
      SIM_ENTRYPOINT: ${{ vars.SIM_ENTRYPOINT }}
      SIMULATION_ENTRYPOINT_URL: ${{ secrets.SIMULATION_ENTRYPOINT_URL }}
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.PRODUCTION_POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
      ROUTE_IMPL_HEALTH: ${{ vars.ROUTE_IMPL_HEALTH }}
      ROUTE_IMPL_SPECIFICATION: ${{ vars.ROUTE_IMPL_SPECIFICATION }}
      ROUTE_IMPL_METADATA: ${{ vars.ROUTE_IMPL_METADATA }}
      ROUTE_IMPL_POLICY: ${{ vars.ROUTE_IMPL_POLICY }}
      ROUTE_IMPL_HOUSEHOLD: ${{ vars.ROUTE_IMPL_HOUSEHOLD }}
      DB_READ_POLICY: ${{ vars.DB_READ_POLICY }}
      DB_WRITE_POLICY: ${{ vars.DB_WRITE_POLICY }}
      DB_READ_HOUSEHOLD: ${{ vars.DB_READ_HOUSEHOLD }}
      DB_WRITE_HOUSEHOLD: ${{ vars.DB_WRITE_HOUSEHOLD }}
      PUBLIC_API_AUTH_REQUIRED: ${{ vars.PUBLIC_API_AUTH_REQUIRED }}
      PUBLIC_API_AUTH_ISSUER: ${{ vars.PUBLIC_API_AUTH_ISSUER }}
      PUBLIC_API_AUTH_AUDIENCE: ${{ vars.PUBLIC_API_AUTH_AUDIENCE }}
      AUTH0_MANAGEMENT_DOMAIN: ${{ vars.AUTH0_MANAGEMENT_DOMAIN }}
      AUTH0_MANAGEMENT_CLIENT_ID: ${{ vars.AUTH0_MANAGEMENT_CLIENT_ID }}
      AUTH0_MANAGEMENT_CLIENT_SECRET_RESOURCE: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET_RESOURCE }}
      CLOUD_RUN_SERVICE: policyengine-api
      CLOUD_RUN_RUNTIME_CACHE_ENVIRONMENT: production
      CLOUD_RUN_RUNTIME_CACHE_URL_SECRET: policyengine-api-prod-runtime-cache-url:latest
      CLOUD_RUN_RUNTIME_CACHE_CA_CERT_SECRET: policyengine-api-prod-runtime-cache-ca:latest
      CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.PRODUCTION_CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
      V2_SUPABASE_PROJECT_REF: ${{ vars.V2_SUPABASE_PROJECT_REF }}
      V2_SUPABASE_ENVIRONMENT: ${{ vars.V2_SUPABASE_ENVIRONMENT }}
      PRODUCTION_V2_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_V2_SUPABASE_PROJECT_REF }}
      V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ secrets.V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE: ${{ vars.PRODUCTION_V2_RUNTIME_DATABASE_URL_SECRET_RESOURCE }}
      # Sized by the Stage 2 qualification and the PR 4 host cutover — rationale
      # and numbers in docs/migration/cloud-run-operations.md ("Runtime shape and
      # scaling"). Warm capacity is expressed service-level (--min); the
      # revision-level floor stays 0 (default in cloud_run_env.sh) to avoid
      # per-tag pinning. Max raised to 8 for the 100% Cloud Run cutover: at 50/50
      # the service was already pinned at the previous ceiling of 4 during the
      # daytime peak, so full traffic needs the extra headroom.
      CLOUD_RUN_SERVICE_MIN_INSTANCES: "2"
      CLOUD_RUN_MAX_INSTANCES: "8"
      # uv installs uv.lock on the Cloud Run image's Python, not the 3.14
      # that .python-version selects.
      UV_PYTHON: "3.12"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Synchronize complete Cloud Run runtime secret batch
        env:
          POLICYENGINE_DB_PASSWORD: ${{ secrets.POLICYENGINE_DB_PASSWORD }}
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PE_UK_PRIVATE_HF_READ_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
        run: bash .github/scripts/sync_cloud_run_secrets.sh --include-database-password
      - name: Capture current Cloud Run production state
        id: previous
        run: bash .github/scripts/capture_cloud_run_service_state.sh >> "$GITHUB_OUTPUT"
      - name: Compute Cloud Run candidate metadata
        id: cloud_run
        run: bash .github/scripts/compute_cloud_run_metadata.sh stage3-prod
      - name: Deploy tagged Cloud Run candidate
        run: bash .github/scripts/deploy_cloud_run_candidate.sh
        env:
          PREVIOUS_CLOUD_RUN_REVISION: ${{ steps.previous.outputs.revision }}
          CLOUD_RUN_IMAGE_TAG: ${{ steps.cloud_run.outputs.image_tag }}
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
          CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
          POLICYENGINE_DB_USER: ${{ vars.POLICYENGINE_DB_USER }}
          POLICYENGINE_DB_NAME: ${{ vars.POLICYENGINE_DB_NAME }}
          GATEWAY_AUTH_ISSUER: ${{ secrets.GATEWAY_AUTH_ISSUER }}
          GATEWAY_AUTH_AUDIENCE: ${{ secrets.GATEWAY_AUTH_AUDIENCE }}
          GATEWAY_AUTH_CLIENT_ID: ${{ secrets.GATEWAY_AUTH_CLIENT_ID }}
          GATEWAY_AUTH_CLIENT_SECRET_RESOURCE: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET_RESOURCE }}
          OBSERVABILITY_SERVICE_NAMESPACE: ${{ vars.OBSERVABILITY_SERVICE_NAMESPACE }}
          OBSERVABILITY_TRACE_PROJECT_ID: ${{ vars.OBSERVABILITY_TRACE_PROJECT_ID }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT }}
          POLICYENGINE_OTEL_GOOGLE_AUDIENCE: ${{ vars.OBSERVABILITY_OTLP_GOOGLE_AUDIENCE }}
      - name: Resolve exact Cloud Run production candidate
        id: candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh >> "$GITHUB_OUTPUT"
        env:
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
      - name: Wait for Cloud Run candidate health
        run: bash .github/scripts/health_check.sh "${{ steps.candidate.outputs.url }}/readiness-check"
      - name: Install locked Cloud Run smoke test dependencies
        run: make install
      - name: Run Cloud Run candidate smoke tests
        run: uv run --frozen --extra dev python -m pytest tests/integration/test_cloud_run_candidate.py tests/integration/test_live_v2_metadata.py -v
        env:
          API_BASE_URL: ${{ steps.candidate.outputs.url }}
          STAGING_API_TEST_PROBE_ID: cloud-run-${{ steps.cloud_run.outputs.revision_tag }}
      - name: Verify exact tested Cloud Run production candidate
        run: bash .github/scripts/resolve_cloud_run_candidate_state.sh
        env:
          CLOUD_RUN_TAG: ${{ steps.cloud_run.outputs.revision_tag }}
          CLOUD_RUN_EXPECTED_REVISION: ${{ steps.candidate.outputs.revision }}
          CLOUD_RUN_EXPECTED_IMAGE: ${{ steps.candidate.outputs.image }}
      - name: Promote Cloud Run production candidate
        id: promote
        continue-on-error: true
        run: bash .github/scripts/set_cloud_run_revision.sh
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ steps.candidate.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ steps.previous.outputs.revision }}
      - name: Wait for Cloud Run production service health
        id: stable_health
        if: ${{ steps.promote.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/health_check.sh "${{ steps.previous.outputs.stable_url }}/readiness-check"
      - name: Restore previous Cloud Run production revision
        if: ${{ steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure' }}
        run: bash .github/scripts/restore_cloud_run_revision.sh "${{ steps.previous.outputs.stable_url }}/readiness-check"
        env:
          CLOUD_RUN_TARGET_REVISION: ${{ steps.previous.outputs.revision }}
          CLOUD_RUN_EXPECTED_CURRENT_REVISION: ${{ steps.candidate.outputs.revision }}
      - name: Fail after unsuccessful Cloud Run production promotion
        if: ${{ always() && (steps.promote.outcome == 'failure' || steps.stable_health.outcome == 'failure') }}
        run: exit 1

  cleanup-cloud-run-images:
    name: Clean up old Cloud Run images
    runs-on: ubuntu-latest
    needs: deploy-cloud-run-candidate
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.deploy-cloud-run-candidate.result == 'success'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      # The Cloud Run deploy pushes a new image every release and nothing prunes
      # them, so the repo grows without bound. Keep the 15 most recent image
      # versions (default in the script) and delete older ones.
      - name: Prune old Cloud Run images
        run: bash .github/scripts/cleanup_cloud_run_images.sh

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: deploy-cloud-run-candidate
    if: |
      !cancelled()
      && (github.repository == 'PolicyEngine/policyengine-api')
      && (github.event.head_commit.message == 'Update PolicyEngine API')
      && needs.deploy-cloud-run-candidate.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        run: docker build -t ghcr.io/policyengine/policyengine docker
      - name: Push container
        run: docker push ghcr.io/policyengine/policyengine
