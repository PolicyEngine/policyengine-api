name: Adopt existing v1 Cloud SQL schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ADOPT-eafc2a547a4e to stamp and upgrade the existing database
        required: true
        type: string
      expected_question_rows:
        description: Expected number of orphaned question rows that the migration removes
        required: true
        default: "9"
        type: string

concurrency:
  group: policyengine-api-v1-cloud-sql-schema
  cancel-in-progress: false

jobs:
  adopt:
    name: Stamp and upgrade existing Cloud SQL database
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production-database
    permissions:
      contents: read
      id-token: write
    env:
      POLICYENGINE_DB_INSTANCE_CONNECTION_NAME: ${{ vars.POLICYENGINE_DB_INSTANCE_CONNECTION_NAME }}
    steps:
      - name: Require explicit baseline confirmation
        run: test "${{ inputs.confirmation }}" = "ADOPT-eafc2a547a4e"
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DB_MIGRATION_SERVICE_ACCOUNT }}
      - name: Set up GCloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Install dependencies
        run: make install
      - name: Start Cloud SQL Auth Proxy
        run: bash .github/scripts/start_cloud_sql_proxy.sh
      - name: Prepare masked database URLs
        run: |
          POLICYENGINE_DB_READONLY_PASSWORD="$(gcloud secrets versions access latest --secret policyengine-api-prod-db-readonly-password --project policyengine-api)"
          POLICYENGINE_DB_MIGRATION_PASSWORD="$(gcloud secrets versions access latest --secret policyengine-api-prod-db-migration-password --project policyengine-api)"
          export POLICYENGINE_DB_READONLY_PASSWORD POLICYENGINE_DB_MIGRATION_PASSWORD
          uv run python scripts/write_v1_database_urls.py
      - name: Verify legacy schema
        run: >-
          uv run python scripts/v1_database_migration.py
          --mode verify-legacy
          --expected-question-rows "${{ inputs.expected_question_rows }}"
      - name: Create Cloud SQL backup
        id: backup
        run: bash .github/scripts/create_cloud_sql_backup.sh
      - name: Stamp baseline and upgrade
        run: >-
          uv run python scripts/v1_database_migration.py
          --mode adopt
          --confirmation "${{ inputs.confirmation }}"
          --backup-id "${{ steps.backup.outputs.backup_id }}"
          --expected-question-rows "${{ inputs.expected_question_rows }}"
      - name: Verify migrated schema
        run: uv run python scripts/v1_database_migration.py --mode verify-head
      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: bash .github/scripts/stop_cloud_sql_proxy.sh
