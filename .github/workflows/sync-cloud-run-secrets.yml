name: Sync Cloud Run secrets

on:
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: GitHub and Cloud Run environment to synchronize
        required: true
        default: production
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cloud-run-secret-sync

jobs:
  sync-cloud-run-secrets:
    name: Sync GitHub secrets to Secret Manager
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require master branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Cloud Run secret sync must run from master."
          exit 1
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: GCP authentication
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}"
      - name: Set up GCloud
        uses: "google-github-actions/setup-gcloud@v2"
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Sync shared staging runtime secrets
        if: inputs.deployment_environment == 'staging'
        env:
          CLOUD_RUN_PROJECT: policyengine-api
          CLOUD_RUN_SERVICE: policyengine-api-staging
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PE_UK_PRIVATE_HF_READ_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
        run: bash .github/scripts/sync_cloud_run_secrets.sh
      - name: Sync complete production runtime secret batch
        if: inputs.deployment_environment == 'production'
        env:
          CLOUD_RUN_PROJECT: policyengine-api
          CLOUD_RUN_SERVICE: policyengine-api
          CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET: ${{ vars.CLOUD_RUN_POLICYENGINE_DB_PASSWORD_SECRET }}
          POLICYENGINE_DB_PASSWORD: ${{ secrets.POLICYENGINE_DB_PASSWORD }}
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PE_UK_PRIVATE_HF_READ_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
        run: bash .github/scripts/sync_cloud_run_secrets.sh --include-database-password
